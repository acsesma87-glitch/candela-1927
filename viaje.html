<title>El viaje de Candela</title>

<style>
/* VOICE: diario de viaje de 1927, íntimo y con humor, una entrada al día
   IDEA: un cuaderno de viaje con postales: cada día se despega una postal nueva
   PICTURE: siete postales nocturnas de La Plata a Hondarribia, con Candela y Laika
   COLOUR and TYPE: noche, papel envejecido, lacre rojo; Limelight + Special Elite
   LAYOUT: una columna de postales; las cerradas son sobres lacrados con su fecha */
:root{color-scheme:dark;--bg:#0b0908;--ink:#efe6d4;--ink2:#b9aa90;--paper:#ebdfc4;--red:#8e2a22}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Spectral,Georgia,serif;overflow-x:clip}
.wrap{max-width:760px;margin:0 auto;padding:22px max(4vw,12px) 60px}
h1{font:clamp(34px,7vw,52px)/1.05 Limelight,Georgia,serif;margin:0;color:var(--paper);text-wrap:balance}
.sub{color:var(--ink2);font-style:italic;margin:6px 0 22px}
.route{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:14px "Special Elite",monospace;color:var(--ink2);margin-bottom:26px}
.route span{padding:2px 8px;border:1px solid #3a2f27;border-radius:12px}
.route span.on{border-color:var(--paper);color:var(--paper)}
.card{margin:0 0 30px;background:var(--paper);color:#22170f;border-radius:4px;box-shadow:0 14px 40px #000c;overflow:hidden;position:relative}
.card img{display:block;width:100%;aspect-ratio:8/5;object-fit:cover;border-bottom:1px solid #c9b48f}
.body{padding:16px clamp(16px,4vw,30px) 20px;position:relative}
.body::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 29px,#8a6f5014 29px 30px);pointer-events:none}
.date{font:15px "Special Elite",monospace;color:var(--red);margin:0 0 6px}
.body p{font:clamp(16px,2.4vw,18px)/1.65 "Special Elite","Courier New",monospace;margin:0}
.lock{display:grid;place-items:center;text-align:center;min-height:220px;background:#d9cba9;color:#4a3a28;padding:24px}
.seal{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b4433a,#6e1c16);display:grid;place-items:center;color:#f2d8c8;font:30px Limelight,serif;box-shadow:0 4px 10px #0005;margin:0 auto 12px}
.lock b{font:18px Limelight,serif;display:block;margin-bottom:4px}
.lock small{font:15px "Special Elite",monospace}
.next{background:#1a120d;color:var(--paper);text-align:center;padding:26px 20px;border-radius:4px;border:1px solid #3a2f27}
.next h2{font:28px Limelight,serif;margin:0 0 8px;font-weight:400}
.next a{display:inline-block;margin-top:10px;color:var(--paper);border:1px solid var(--paper);padding:10px 18px;border-radius:6px;text-decoration:none;min-height:44px}
.pic{position:relative;overflow:hidden}
.dog{position:absolute;left:0;bottom:3%;width:9%;pointer-events:none;z-index:3;display:none}
.dog.on{display:block}
.dog svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 4px 4px #000a) brightness(.85) saturate(.75)}
.dog .leg{transform-box:fill-box;transform-origin:50% 0}
.dog.run .la{animation:trot .28s linear infinite}.dog.run .lb{animation:trot .28s linear infinite reverse}
.dog .tail{transform-box:fill-box;transform-origin:100% 100%;animation:wag .3s ease-in-out infinite alternate}
.dog.sniff .head{transform-box:fill-box;transform-origin:20% 80%;animation:bob .35s ease-in-out infinite alternate}
@keyframes trot{0%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}100%{transform:rotate(22deg)}}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
@keyframes bob{from{transform:rotate(0)}to{transform:rotate(14deg)}}
.bubble{position:absolute;z-index:4;left:50%;bottom:30%;transform:translateX(-50%);background:var(--paper);color:#21170f;border-radius:10px;padding:8px 12px;font:15px/1.35 Spectral,serif;width:max-content;max-width:min(300px,80%);box-shadow:0 6px 20px #000c;opacity:0;transition:opacity .25s;pointer-events:none}
.bubble.on{opacity:1}
.lk{display:inline-flex;align-items:center;gap:8px;margin-top:14px;min-height:44px;padding:0 16px;border-radius:6px;border:1px solid #8a6f50;background:#f7efdc;color:#21170f;font:16px Spectral,serif;cursor:pointer;position:relative}
.lk:disabled{opacity:.5;cursor:default}
.lk svg{width:24px;height:24px}
.fade{animation:in 1.2s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}}

body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
</style>
</head>

const FUN={
24:['Laika se ha metido en la maleta. Por si acaso te vas sin ella.','Laika está mordisqueando la carta de Aitor. ¡Eh, que eso es importante!','Laika ha encontrado una galleta debajo del sillón. Para ella, caso resuelto.'],
25:['Laika le ladra al caballo. El caballo ni se inmuta.','Laika saca la cabeza por la ventanilla y se le vuelan las orejas.','Laika ha olido un asado. Quiere bajarse aquí mismo.'],
26:['Laika persigue a una gaviota por el muelle. Gana la gaviota.','Laika olfatea los baúles de un señor muy serio. El señor no se ríe.','Laika quiere volver a casa.'],
27:['Laika mira el mar muy seria. Demasiada agua para su gusto.','Laika ha encontrado restos de un bocadillo en cubierta. Para ella, caso resuelto.','Laika está chupando la barandilla. Sabe a sal.'],
28:['Laika se esconde debajo de la manta y no piensa salir.','Laika está mareada. Hoy no investiga.','Laika ha intentado comerse la novela policíaca. Así nadie sabrá quién era el asesino.'],
29:['Laika se niega a subir al hidroavión. Hay que cogerla en brazos.','Laika le ha robado una sardina a un pescador. Huye sin remordimientos.','Laika le ladra a la hélice. Gana la hélice.'],
30:['Laika ha encontrado una txistorra caída en la puerta de la sidrería. Felicidad absoluta.','Laika está comiendo un chorongo de otro perro… ¡Laika, suelta eso!','Laika quiere volver a casa… pero ahora la casa está al otro lado del mar.']};
const cnt={};
function place(card,x){const pic=card.querySelector('.pic'),dog=pic.querySelector('.dog');if(!x.rest)return;const W=pic.clientWidth,dw=W*.09;dog.style.bottom=x.rest.b+'%';dog.classList.add('on');dog.style.transform=`translateX(${x.rest.x*W-dw/2}px)`}
async function laika(btn){
  const i=+btn.dataset.i,x=DAYS[i],card=btn.closest('.card'),pic=card.querySelector('.pic'),dog=pic.querySelector('.dog'),flip=dog.querySelector('.flip'),bub=pic.querySelector('.bubble');
  btn.disabled=true;bub.classList.remove('on');dog.getAnimations().forEach(a=>a.cancel());
  const W=pic.clientWidth,dw=W*.09,home=x.rest?x.rest.x*W-dw/2:-dw*1.3,stop=W*(.3+Math.random()*.35),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const go=(a,b,ms,face)=>{flip.style.transform=face<0?'scaleX(-1)':'none';return dog.animate([{transform:`translateX(${a}px)`},{transform:`translateX(${b}px)`}],{duration:reduce?1:ms,fill:'forwards',easing:'linear'}).finished};
  dog.style.transform='';if(!x.rest)dog.style.bottom='4%';
  dog.classList.add('on','run');
  await go(x.rest?home:-dw*1.2,W-dw*.6,1800,1);
  await go(W-dw*.6,stop,1400,-1);
  dog.classList.remove('run');dog.classList.add('sniff');
  await new Promise(r=>setTimeout(r,reduce?10:1100));
  dog.classList.remove('sniff');
  const n=cnt[x.d]||0;cnt[x.d]=n+1;bub.textContent=FUN[x.d][n%FUN[x.d].length];bub.classList.add('on');
  await new Promise(r=>setTimeout(r,3300));
  bub.classList.remove('on');dog.classList.add('run');
  await go(stop,home,1300,home>stop?1:-1);
  dog.classList.remove('run');flip.style.transform='none';if(!x.rest)dog.classList.remove('on');btn.disabled=false;
}
list.querySelectorAll('.lk').forEach(b=>b.onclick=()=>laika(b));
const placeAll=()=>list.querySelectorAll('.lk').forEach(b=>{const c=b.closest('.card');if(!b.disabled)place(c,DAYS[+b.dataset.i])});
placeAll();addEventListener('resize',placeAll);list.querySelectorAll('img').forEach(im=>im.addEventListener('load',placeAll));
document.getElementById('route').innerHTML=DAYS.map(x=>`<span class="${open(x.d)?'on':''}">${x.d}</span>`).join('')+'<span>1 dic</span>';
document.getElementById('next').hidden=!(all||now.getMonth()>10||(now.getMonth()===10&&now.getDate()>=30));
const opened=DAYS.filter(x=>open(x.d));
if(opened.length>1){const el=document.getElementById('dia'+opened[opened.length-1].d);if(el)setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),400)}
}
</script>
