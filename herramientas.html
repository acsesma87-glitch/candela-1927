/* VOICE: noir de 1927, escena de crimen de noche, el jugador con sus herramientas de detective
   IDEA: el maletín del detective: una linterna y una lupa de latón sobre una escena a oscuras
   PICTURE: el faro de Altamar a oscuras; la linterna abre un círculo de luz y la lupa amplía
   COLOUR and TYPE: negro tinta, papel de expediente, latón; Limelight + Spectral
   LAYOUT: escena grande, herramientas debajo, lista de hallazgos al lado (debajo en el móvil) */
:root{color-scheme:dark;--bg:#0e0b09;--ink:#efe6d4;--ink2:#b9aa90;--paper:#ebdfc4;--brass:#c9a24a;--red:#c3352b;--line:#3a2f27}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Spectral,Georgia,serif;overflow-x:clip}
h1,.ttl{font-family:Limelight,Georgia,serif;font-weight:400;line-height:1.05;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:16px max(3vw,12px) 32px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
header h1{font-size:clamp(26px,4vw,38px);color:var(--paper)}
header span{color:var(--ink2);font-style:italic}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;aspect-ratio:8/5;width:100%;border:1px solid var(--line);overflow:hidden;touch-action:none;background:#000;box-shadow:0 20px 60px #000c;cursor:none;user-select:none;-webkit-user-select:none}
.stage img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}

 border:7px solid var(--brass);box-shadow:0 0 0 2px #5a4318,0 10px 30px #000d,inset 0 0 26px #0009}
.lens::after{content:"";position:absolute;left:50%;top:100%;width:14px;height:70px;margin-left:-7px;margin-top:4px;background:linear-gradient(90deg,#3a2414,#6b4426 50%,#3a2414);border-radius:4px;transform-origin:50% -30px;transform:rotate(-35deg)}
.lens::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff3 0,#fff0 40%)}
.stage.t-lupa .lens{display:block}
.dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid var(--paper);pointer-events:none;display:none}
.stage.t-lupa .dot{display:block}
.found{position:absolute;pointer-events:none;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2px solid var(--paper);opacity:0;animation:ping 1.2s ease-out}
@keyframes ping{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.tools button{min-height:52px;padding:0 20px;border-radius:8px;border:1px solid var(--line);background:#1b1512;display:flex;align-items:center;gap:10px;font-size:17px}
.tools button[aria-pressed=true]{background:var(--paper);color:#1a120d;border-color:var(--paper)}
.tools svg{width:26px;height:26px}
.dog{position:absolute;left:0;bottom:3%;width:13%;pointer-events:none;z-index:3;display:none}
.dog.on{display:block}
.dog .flip{transform-origin:50% 50%}
.dog svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 4px 4px #000a) brightness(.82) saturate(.75)}
.dog .leg{transform-box:fill-box;transform-origin:50% 0}
.dog.run .la{animation:trot .28s linear infinite}.dog.run .lb{animation:trot .28s linear infinite reverse}
.dog .tail{transform-box:fill-box;transform-origin:100% 100%;animation:wag .3s ease-in-out infinite alternate}
.dog.sniff .head{transform-box:fill-box;transform-origin:20% 80%;animation:bob .35s ease-in-out infinite alternate}
@keyframes trot{0%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}100%{transform:rotate(22deg)}}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
@keyframes bob{from{transform:rotate(0)}to{transform:rotate(14deg)}}
.bubble{position:absolute;z-index:4;transform:translate(-50%,-100%);background:var(--paper);color:#21170f;border-radius:10px;padding:8px 12px;font-size:15px;line-height:1.3;max-width:min(260px,60%);box-shadow:0 6px 20px #000c;pointer-events:none;opacity:0;transition:opacity .25s}
.bubble.on{opacity:1}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:var(--paper)}
.bubble b{color:#7a1d16}
.item{position:absolute;z-index:2;width:4.5%;transform:translate(-50%,-70%);pointer-events:none;filter:drop-shadow(0 0 8px #ffe7a0)}
.tools button.laika{margin-left:auto}
.tools button:disabled{opacity:.5;cursor:default}
.dog.eki{width:15%;bottom:2.5%}
.dog .tongue{display:none}.dog.happy .tongue{display:block}
.dog.happy .bodyall{animation:hop .32s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.stage.pick{cursor:pointer}
.stage.dogs .lens,.stage.dogs .dot{display:none!important}.stage.dogs .lit{opacity:0!important}.stage.dogs{cursor:default}
.pring{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:2px dashed var(--paper);pointer-events:none;z-index:2;animation:pr 1.1s ease-in-out infinite alternate}
@keyframes pr{from{opacity:.35;transform:scale(.85)}to{opacity:1;transform:scale(1.05)}}
.cap{color:var(--ink2);font-style:italic;margin:10px 0 0;font-size:16px}
aside{background:var(--paper);color:#21170f;border-radius:6px;padding:18px 18px 12px}
aside h2{font-family:Limelight,serif;font-weight:400;font-size:24px;margin:0 0 2px}
aside .n{font-size:15px;color:#6d5a46;margin:0 0 8px}
aside ul{list-style:none;margin:0;padding:0}
aside li{padding:10px 0;border-top:1px solid #c9b48f;font-size:16px;line-height:1.4}
aside li b{display:block;font-weight:600}
aside li.no{color:#8a7a62;font-style:italic}
aside li .tg{display:inline-block;font-size:13px;padding:0 8px;border-radius:10px;background:#21170f;color:var(--paper);margin-top:4px;font-style:normal}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);background:var(--paper);color:#21170f;padding:10px 18px;border-radius:6px;box-shadow:0 8px 30px #000;z-index:9;transition:transform .35s,opacity .35s;opacity:0;max-width:92vw}
.toast.on{transform:translate(-50%,0);opacity:1}
.reset{margin-top:8px;min-height:44px;border:1px solid #8a6f50;background:#f7efdc;border-radius:6px;padding:0 14px;color:#21170f}
:focus-visible{outline:3px solid #f6dfae;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.found{animation:none}.toast,.lit{transition:none}}

body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
</style>

<path d="M90 6 L93 -14 L100 4Z" fill="#2e2620"/><path d="M92.5 2 L93.6 -8 L97 2Z" fill="#6a5046"/>
<path d="M98 4 L106 -15 L108 6Z" fill="#2e2620"/><path d="M101 3 L105.5 -7 L106.5 4Z" fill="#6a5046"/>
<ellipse cx="100" cy="14" rx="12" ry="10" fill="#4a3d30"/>
<path d="M104 10 L121 18 Q123 23 117 25 L102 23Z" fill="#2a2420"/>
<path d="M103 18 Q110 15 119 19 Q120 24 116 25 L104 23Z" fill="#8f8a82" opacity=".75"/><ellipse cx="101" cy="9" rx="4" ry="2" fill="#8f8a82" opacity=".6"/><ellipse cx="95" cy="16" rx="3" ry="4" fill="#8f8a82" opacity=".45"/>
<path d="M96 9 q4 -3 9 0" stroke="#8a857c" stroke-width="1.2" fill="none"/>
<circle cx="120.5" cy="19.5" r="2.6" fill="#0e0c0a"/>
<circle cx="103" cy="11.5" r="1.9" fill="#0e0c0a"/><circle cx="103.5" cy="11" r=".5" fill="#ccc"/>
<path class="tongue" d="M112 24 q2 8 6 6 q2 -2 0 -7Z" fill="#b8807e"/>
</g></g></svg></div></div>
<div class="bubble" id="bubble"></div>
    <div class="dot" id="dot"></div>
  </div>
  <div class="tools" role="group" aria-label="Herramientas">
    <button id="tLinterna" aria-pressed="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 13h9l4-4h4v14h-4l-4-4H6z"/><path d="M26 10l3-2M26 16h4M26 22l3 2"/></svg>Linterna</button>
    <button id="tLupa" aria-pressed="false"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="13" cy="13" r="8"/><path d="M19 19l9 9"/></svg>Lupa</button>
  <button id="tLaika" class="laika"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 20c0-5 4-8 9-8h7l3-4 3 1-1 5c1 1 2 3 2 5"/><path d="M9 20v6M14 20v6M22 20v6M27 19v7M5 20l-2-5"/></svg>Soltar a Laika</button>
  <button id="tEki"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 4l2 7 4-6v9l2 3-3 2h-6"/><path d="M19 19c-5 0-12 1-14 5v4M10 22v6M17 21v7"/></svg>Soltar a Eki</button>
  </div>
  <p class="cap" id="cap">La linterna ilumina donde apuntas. Mueve el dedo por la escena: en la oscuridad hay cosas que no se ven a simple vista.</p>
</div>
<aside aria-live="polite">
  <h2>Hallazgos</h2>
  <p class="n" id="cnt"></p>
  <ul id="list"></ul>
  <button class="reset" id="reset">Volver a empezar</button>
</aside>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
{
const $=s=>document.querySelector(s);
const st=$('#st'),lit=$('#lit'),lens=$('#lens'),dot=$('#dot');
const CLUES=[
 {id:'huellas',tool:'linterna',x:140,y:480,r:60,t:'Huellas que salen del agua',d:'Pisadas de bota que vienen del mar y van hacia el cuerpo. Alguien llegó en barca.'},
 {id:'boton',tool:'linterna',x:598,y:476,r:34,t:'Un botón dorado',d:'Entre las rocas, un botón de abrigo arrancado. No es del guardia ni del doctor.'},
 {id:'ficha',tool:'lupa',x:296,y:447,r:20,t:'Una ficha del Casino',d:'En la mano del muerto, una ficha roja con una «C». Estuvo en el Casino esa noche.'},
 {id:'pantalon',tool:'lupa',x:536,y:441,r:26,t:'Los pantalones del doctor',d:'Los bajos, mojados de mar, con arena y un hilo de alga. ¿No había llegado en automóvil?'},
 {id:'ampolla',tool:'laika',x:470,y:468,t:'Una ampolla rota',d:'Laika la saca de entre las rocas: una ampolla de cristal vacía, con un olor dulzón y raro. ¿Medicina?'},
 {id:'eter',tool:'eki',x:540,y:400,t:'Eki no se acerca al doctor',d:'Eki, que saluda a todo el mundo, se para a dos pasos del doctor y no se acerca. Al pasar a su lado notas un olor dulzón: éter.'},
 {id:'gaviota',tool:'lupa',x:166,y:276,r:24,t:'El nombre de la barca',d:'En el casco de la barca de la niebla se lee: GAVIOTA.'}
];
let found=[];try{found=JSON.parse(localStorage.getItem('lupa-linterna'))||[]}catch(e){}
let tool='linterna',px=400,py=300,dwell={},touch=false;
function list(){
  $('#cnt').textContent=`${found.length} de ${CLUES.length} pistas encontradas`;
  $('#list').innerHTML=CLUES.map(c=>found.includes(c.id)?`<li><b>${c.t}</b>${c.d}</li>`:`<li class="no">Algo sin descubrir<br><span class="tg">${c.tool==='lupa'?'con la lupa':c.tool==='laika'?'con Laika':c.tool==='eki'?'con Eki':'con la linterna'}</span></li>`).join('');
}
function toast(t){const el=$('#toast');el.innerHTML=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2800)}
function setTool(t){tool=t;st.classList.toggle('t-linterna',t==='linterna');st.classList.toggle('t-lupa',t==='lupa');
  $('#tLinterna').setAttribute('aria-pressed',t==='linterna');$('#tLupa').setAttribute('aria-pressed',t==='lupa');
  $('#cap').textContent=t==='lupa'?'La lupa amplía lo que tiene debajo. Pásala despacio por los detalles: manos, ropa, objetos lejanos.':'La linterna ilumina donde apuntas. Mueve el dedo por la escena: en la oscuridad hay cosas que no se ven a simple vista.';
  draw()}
$('#tLinterna').onclick=()=>setTool('linterna');$('#tLupa').onclick=()=>setTool('lupa');
function draw(){
  const W=st.clientWidth,H=st.clientHeight,k=W/800;
  const x=px*k,y=py*k;
  st.style.setProperty('--x',x+'px');st.style.setProperty('--y',y+'px');st.style.setProperty('--r',Math.max(90,W*.17)+'px');
  const L=Math.round(Math.min(220,Math.max(130,W*.27))),z=2.6;
  const lx=x,ly=touch?y-L*.75:y;
  lens.style.width=lens.style.height=L+'px';
  lens.style.transform=`translate(${lx-L/2}px,${ly-L/2}px)`;
  lens.style.backgroundSize=`${W*z}px ${H*z}px`;
  lens.style.backgroundPosition=`${-(x*z-L/2+7)}px ${-(y*z-L/2+7)}px`;
  dot.style.left=x+'px';dot.style.top=y+'px';dot.style.opacity=touch?1:0;
}
function at(e){const r=st.getBoundingClientRect();px=Math.min(800,Math.max(0,(e.clientX-r.left)/r.width*800));py=Math.min(500,Math.max(0,(e.clientY-r.top)/r.width*800));touch=e.pointerType==='touch';draw()}
st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);at(e)});
st.addEventListener('pointermove',at);
st.addEventListener('keydown',e=>{const s=12,m={ArrowLeft:[-s,0],ArrowRight:[s,0],ArrowUp:[0,-s],ArrowDown:[0,s]}[e.key];if(m){e.preventDefault();px=Math.min(800,Math.max(0,px+m[0]));py=Math.min(500,Math.max(0,py+m[1]));draw()}});
new ResizeObserver(draw).observe(st);
function reach(){const W=st.clientWidth,k=W/800;
  if(tool==='lupa'){const L=Math.min(220,Math.max(130,W*.27));return (L/2-7)/2.6/k*.85}
  return Math.max(90,W*.17)*.6/k}
const DOG=$('#dog'),FLIP=$('#flip'),BUB=$('#bubble');
const FUN=['Laika está comiendo un chorongo de otro perro… ¡Laika, suelta eso!','Laika ha encontrado restos de un bocadillo. Para ella, caso resuelto.','Laika quiere volver a casa.','Laika está chupando el suelo. Muy concentrada.','Laika ha perseguido a una gaviota. Gana la gaviota.','Laika se ha sentado y te mira. Sin novedad.'];
let funI=Math.floor(Math.random()*FUN.length),busy=false;
const ITEMSVG='<svg viewBox="0 0 40 40"><path d="M16 4h8v6l4 6v18a3 3 0 0 1-3 3H15a3 3 0 0 1-3-3V16l4-6z" fill="#cfe8e4" fill-opacity=".85" stroke="#fff" stroke-width="1.5"/><path d="M12 24l16-6" stroke="#fff" stroke-width="1.5"/><path d="M14 30l6 3 8-5" stroke="#8aa" stroke-width="1"/></svg>';
function showItem(c){const k=st.clientWidth/800,el=document.createElement('div');el.className='item';el.innerHTML=ITEMSVG;el.style.left=c.x/8+'%';el.style.top=c.y/5+'%';st.appendChild(el)}
async function laika(){
  if(busy)return;busy=true;st.classList.add('dogs');$('#tLaika').disabled=$('#tEki').disabled=true;BUB.classList.remove('on');
  const W=st.clientWidth,dw=W*.13,clue=CLUES.find(c=>c.tool==='laika'&&!found.includes(c.id));
  const stopX=(clue?clue.x/800*W:W*(.25+Math.random()*.5))-dw/2;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  DOG.classList.add('on','run');DOG.classList.remove('sniff');
  const go=(a,b,ms,face)=>{FLIP.style.transform=face<0?'scaleX(-1)':'none';return DOG.animate([{transform:`translateX(${a}px)`},{transform:`translateX(${b}px)`}],{duration:reduce?1:ms,fill:'forwards',easing:'linear'}).finished};
  await go(-dw*1.2,W-dw*.6,2200,1);
  await go(W-dw*.6,stopX,1800*(W-dw*.6-stopX)/W+500,-1);
  DOG.classList.remove('run');DOG.classList.add('sniff');
  await new Promise(r=>setTimeout(r,reduce?10:1300));
  DOG.classList.remove('sniff');
  const bx=stopX+dw/2,by=st.clientHeight*.80;
  BUB.style.left=Math.min(W-130,Math.max(130,bx))+'px';BUB.style.top=by+'px';
  if(clue){
    found.push(clue.id);try{localStorage.setItem('lupa-linterna',JSON.stringify(found))}catch(e){}
    BUB.innerHTML='<b>¡Guau! ¡Guau!</b> Laika ha encontrado una pista.';showItem(clue);list();toast('Pista: <b>'+clue.t+'</b>');
  }else{BUB.textContent=FUN[funI%FUN.length];funI++}
  BUB.classList.add('on');
  await new Promise(r=>setTimeout(r,3200));
  BUB.classList.remove('on');
  await go(stopX,-dw*1.3,1400*(stopX+dw)/W+300,-1);
  DOG.classList.remove('on');busy=false;st.classList.remove('dogs');$('#tLaika').disabled=$('#tEki').disabled=false;
}
$('#tLaika').onclick=laika;
if(found.includes('ampolla'))setTimeout(()=>showItem(CLUES.find(c=>c.id==='ampolla')),0);
const EKI=$('#eki'),FLIPE=$('#flipE');
const PEOPLE=[{id:'guardia',x:250,y:380,w:45,h:90,greet:true,name:'al guardia'},{id:'doctor',x:540,y:395,w:50,h:70,greet:false,name:'al doctor'}];
const HAPPY=['Eki va corriendo a saludar al guardia. Él le rasca detrás de las orejas y ella se derrite.','Eki le planta las patas al guardia en el abrigo. Ya son amigos.'];
const SNUB=['Eki se para a dos pasos del doctor y te da la pata para que la toques.','Eki se queda quieta, mira al doctor… y luego te mira a ti para que le hagas caso.','Eki da media vuelta y se va corriendo a olerle el culo a Laika.'];
let picking=false,hi=0,sn=0;
let ekiX=null,pickT=null;
const ring=p=>{const k=st.clientWidth/800,el=document.createElement('div');el.className='pring';el.style.left=p.x*k+'px';el.style.top=p.y*k+'px';st.appendChild(el)};
async function ekiIn(){
  if(busy)return;busy=true;st.classList.add('dogs');$('#tLaika').disabled=$('#tEki').disabled=true;BUB.classList.remove('on');
  const W=st.clientWidth,dw=W*.15;ekiX=W*.04;
  EKI.classList.add('on','run');FLIPE.style.transform='none';
  await EKI.animate([{transform:`translateX(${-dw*1.2}px)`},{transform:`translateX(${ekiX}px)`}],{duration:900,fill:'forwards',easing:'ease-out'}).finished;
  EKI.classList.remove('run');EKI.classList.add('happy');
  BUB.style.left=Math.max(130,ekiX+dw/2)+'px';BUB.style.top=st.clientHeight*.74+'px';
  BUB.innerHTML='<b>Eki quiere saludar.</b> Toca a una persona de la escena.';BUB.classList.add('on');
  PEOPLE.forEach(ring);picking=true;st.classList.add('pick');
  $('#cap').textContent='Toca a la persona a la que quieres que vaya Eki.';
  pickT=setTimeout(()=>{if(picking)pickDone(null)},9000);
}
$('#tEki').onclick=ekiIn;
function pickDone(p){
  picking=false;clearTimeout(pickT);st.classList.remove('pick');st.querySelectorAll('.pring').forEach(e=>e.remove());EKI.classList.remove('happy');setTool(tool);
  if(p)ekiGo(p);else ekiOut('Eki se aburre de esperar y se vuelve con Laika.');
}
st.addEventListener('pointerdown',e=>{if(!picking)return;const r=st.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*800,y=(e.clientY-r.top)/r.height*500;
  const p=PEOPLE.find(p=>Math.abs(x-p.x)<p.w+15&&Math.abs(y-p.y)<p.h+15);
  if(p)pickDone(p);else{BUB.innerHTML='Ahí no hay nadie… <b>toca a una persona</b>.';}});
async function ekiOut(msg){
  const W=st.clientWidth,dw=W*.15;
  if(msg){BUB.textContent=msg;BUB.classList.add('on');await new Promise(r=>setTimeout(r,1800))}
  BUB.classList.remove('on');EKI.classList.add('run');FLIPE.style.transform='scaleX(-1)';
  await EKI.animate([{transform:`translateX(${ekiX}px)`},{transform:`translateX(${-dw*1.3}px)`}],{duration:900,fill:'forwards'}).finished;
  EKI.classList.remove('on','run');busy=false;st.classList.remove('dogs');$('#tLaika').disabled=$('#tEki').disabled=false;
}
async function ekiGo(p){
  BUB.classList.remove('on');
  const W=st.clientWidth,dw=W*.15,k=W/800,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const target=(p.greet?p.x-60:p.x-150)*k-dw/2;
  EKI.classList.add('on','run');EKI.classList.remove('happy');
  const go=(a,b,ms,face)=>{FLIPE.style.transform=face<0?'scaleX(-1)':'none';return EKI.animate([{transform:`translateX(${a}px)`},{transform:`translateX(${b}px)`}],{duration:reduce?1:ms,fill:'forwards',easing:'ease-out'}).finished};
  await go(ekiX,target,1100,target>=ekiX?1:-1);ekiX=target;
  EKI.classList.remove('run');
  const bx=target+dw/2;BUB.style.left=Math.min(W-130,Math.max(130,bx))+'px';BUB.style.top=st.clientHeight*.74+'px';
  if(p.greet){EKI.classList.add('happy');BUB.textContent=HAPPY[hi++%HAPPY.length]}
  else{BUB.textContent=SNUB[sn++%SNUB.length];const c=CLUES.find(c=>c.id==='eter');
    if(!found.includes('eter')){found.push('eter');try{localStorage.setItem('lupa-linterna',JSON.stringify(found))}catch(e){}list();setTimeout(()=>toast('Pista: <b>'+c.t+'</b>'),900)}}
  BUB.classList.add('on');
  await new Promise(r=>setTimeout(r,3400));
  BUB.classList.remove('on');EKI.classList.remove('happy');EKI.classList.add('run');
  await go(target,-dw*1.3,1300,-1);
  EKI.classList.remove('on','run');busy=false;st.classList.remove('dogs');$('#tLaika').disabled=$('#tEki').disabled=false;
}
let last=performance.now();
function tick(now){
  const dt=now-last;last=now;
  for(const c of CLUES){
    if(busy)break;
    if(found.includes(c.id))continue;
    const near=c.tool===tool&&Math.hypot(px-c.x,py-c.y)<reach();
    dwell[c.id]=near?(dwell[c.id]||0)+dt:0;
    if(dwell[c.id]>450){found.push(c.id);try{localStorage.setItem('lupa-linterna',JSON.stringify(found))}catch(e){}
      list();toast('Pista: <b>'+c.t+'</b>');
      const k=st.clientWidth/800,p=document.createElement('div');p.className='found';p.style.left=c.x*k+'px';p.style.top=c.y*k+'px';st.appendChild(p);setTimeout(()=>p.remove(),1300);
      if(found.length===CLUES.length)setTimeout(()=>toast('¡Escena registrada a fondo!'),3000)}
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
$('#reset').onclick=()=>{found=[];st.querySelectorAll('.item').forEach(e=>e.remove());try{localStorage.removeItem('lupa-linterna')}catch(e){}list()};
list();draw();
}
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
