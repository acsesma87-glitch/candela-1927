<title>Noche en el hostal</title>

<style>
/* VOICE: la última noche antes del caso, tranquila y con humor
   IDEA: el maletín del detective abierto sobre la cama del hostal
   PICTURE: la habitación del Hostal Itsaso a oscuras; la linterna y la lupa descubren cosas cotidianas
   COLOUR and TYPE: noche, papel de expediente, latón; Limelight + Special Elite + Spectral
   LAYOUT: escena arriba, herramientas debajo, lista de cosas encontradas al lado (debajo en el móvil) */
:root{color-scheme:dark;--bg:#0b0908;--ink:#efe6d4;--ink2:#b9aa90;--paper:#ebdfc4;--brass:#c9a24a;--red:#8e2a22;--line:#3a2f27}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Spectral,Georgia,serif;overflow-x:clip;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:14px max(3vw,12px) 32px}
.back{color:var(--ink2);text-decoration:none;font-size:15px;display:inline-block;min-height:44px;line-height:44px}
h1{font:clamp(26px,4.5vw,40px)/1.05 Limelight,Georgia,serif;margin:0;color:var(--paper)}
.intro{font:clamp(15px,2.2vw,17px)/1.6 "Special Elite","Courier New",monospace;color:var(--ink2);margin:8px 0 14px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;aspect-ratio:8/5;width:100%;border:1px solid var(--line);overflow:hidden;touch-action:none;background:#000;box-shadow:0 20px 60px #000c;user-select:none;-webkit-user-select:none}
.stage img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}

.lens::after{content:"";position:absolute;left:50%;top:100%;width:14px;height:70px;margin-left:-7px;margin-top:4px;background:linear-gradient(90deg,#3a2414,#6b4426 50%,#3a2414);border-radius:4px;transform-origin:50% -30px;transform:rotate(-35deg)}
.stage.t-lupa .lens{display:block;z-index:5}
.lv{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.ldog{position:absolute;left:0;top:0}
.ldog svg{width:100%;height:auto;display:block;overflow:visible;filter:brightness(.8) saturate(.75)}
.ldog .tail{transform-box:fill-box;transform-origin:100% 100%;animation:wag .3s ease-in-out infinite alternate}
.stage.dogs .lens{display:none!important}.stage.dogs .lit{opacity:0!important}
.found{position:absolute;pointer-events:none;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2px solid var(--paper);opacity:0;animation:ping 1.2s ease-out}
@keyframes ping{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
.dog{position:absolute;left:0;bottom:4%;width:9%;pointer-events:none;z-index:3}
.dog svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 4px 4px #000a) brightness(.8) saturate(.75)}
.dog .leg{transform-box:fill-box;transform-origin:50% 0}
.dog.run .la{animation:trot .28s linear infinite}.dog.run .lb{animation:trot .28s linear infinite reverse}
.dog .tail{transform-box:fill-box;transform-origin:100% 100%;animation:wag .3s ease-in-out infinite alternate}
.dog.sniff .head{transform-box:fill-box;transform-origin:20% 80%;animation:bob .35s ease-in-out infinite alternate}
@keyframes trot{0%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}100%{transform:rotate(22deg)}}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
@keyframes bob{from{transform:rotate(0)}to{transform:rotate(14deg)}}
.dog.lie svg{transform:translateY(22%) scaleY(.7);transform-origin:50% 100%}.dog.lie .leg{display:none}
.item{position:absolute;z-index:2;width:3.6%;transform:translate(-50%,-60%);pointer-events:none;filter:drop-shadow(0 0 6px #ffe7a0)}
.bubble{position:absolute;z-index:4;left:50%;top:18%;transform:translateX(-50%);background:var(--paper);color:#21170f;border-radius:10px;padding:8px 12px;font-size:15px;line-height:1.35;width:max-content;max-width:min(320px,82%);box-shadow:0 6px 20px #000c;opacity:0;transition:opacity .25s;pointer-events:none}
.bubble.on{opacity:1}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.tools button{min-height:52px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:#1b1512;display:flex;align-items:center;gap:10px;font-size:17px}
.tools button[aria-pressed=true]{background:var(--paper);color:#1a120d;border-color:var(--paper)}
.tools button:disabled{opacity:.5;cursor:default}
.tools svg{width:26px;height:26px}
.cap{color:var(--ink2);font-style:italic;margin:10px 0 0;font-size:16px}
aside{background:var(--paper);color:#21170f;border-radius:6px;padding:18px 18px 12px}
aside h2{font:24px Limelight,serif;margin:0 0 2px;font-weight:400}
aside .n{font-size:15px;color:#6d5a46;margin:0 0 8px}
aside ul{list-style:none;margin:0;padding:0}
aside li{padding:10px 0;border-top:1px solid #c9b48f;font-size:16px;line-height:1.4}
aside li b{display:block;font-weight:600}
aside li.no{color:#8a7a62;font-style:italic}
aside li .tg{display:inline-block;font-size:13px;padding:0 8px;border-radius:10px;background:#21170f;color:var(--paper);margin-top:4px;font-style:normal}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-140%);background:var(--paper);color:#21170f;padding:10px 18px;border-radius:6px;box-shadow:0 8px 30px #000;z-index:9;transition:transform .35s,opacity .35s;opacity:0;max-width:92vw}
.toast.on{transform:translate(-50%,0);opacity:1}
:focus-visible{outline:3px solid #f6dfae;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.found{animation:none}.toast,.lit{transition:none}}
</style>

 {id:'horquilla',tool:'laika',x:700,y:352,t:'Debajo del armario',d:'Laika ha encontrado una horquilla de pelo. Me viene de perlas para mañana.'},
 {id:'zapatilla2',tool:'laika',x:610,y:440,t:'La otra zapatilla',d:'¡Laika ha encontrado la pareja de la zapatilla de debajo de la cama! Tampoco es mía.'},
 {id:'libreta',tool:'lupa',x:203,y:290,t:'Mi libreta',d:'Regla nº 1: un muerto no siempre está donde murió. Ojalá no me haga falta.'}
];
const FUN=['Laika se ha subido a la cama. Dice que es suya.','Laika ha encontrado una galleta debajo de la mesilla. Para ella, caso resuelto.','Laika está chupando la alfombra. Muy concentrada.','Laika olfatea la zapatilla de debajo de la cama… y estornuda.','Laika quiere volver a casa.','Laika le ladra a la telaraña. La araña ni se inmuta.'];
let fi=Math.floor(Math.random()*FUN.length),busy=false;
let found=[];try{found=JSON.parse(localStorage.getItem('hostal-herramientas'))||[]}catch(e){}
let tool='linterna',px=400,py=260,dwell={},touch=false,q=[],showing=false;
function list(){
  $('#cnt').textContent=`${found.length} de ${ITEMS.length} cosas revisadas`;
  $('#list').innerHTML=ITEMS.map(c=>found.includes(c.id)?`<li><b>${c.t}</b>${c.d}</li>`:`<li class="no">Algo por revisar<br><span class="tg">${c.tool==='lupa'?'con la lupa':c.tool==='laika'?'con Laika':'con la linterna'}</span></li>`).join('');
}
function toast(t){q.push(t);if(!showing)next()}
function next(){const t=q.shift();if(!t){showing=false;return}showing=true;const el=$('#toast');el.innerHTML=t;el.classList.add('on');setTimeout(()=>{el.classList.remove('on');setTimeout(next,400)},2600)}
function setTool(t){tool=t;requestAnimationFrame(draw);st.classList.toggle('t-linterna',t==='linterna');st.classList.toggle('t-lupa',t==='lupa');
  $('#tLinterna').setAttribute('aria-pressed',t==='linterna');$('#tLupa').setAttribute('aria-pressed',t==='lupa');
  $('#cap').textContent=t==='lupa'?'La lupa amplía lo que tiene debajo. Desliza el dedo por cualquier parte para moverla despacio por los detalles.':'La linterna ilumina donde apuntas. Desliza el dedo por cualquier parte de la pantalla para moverla.';draw()}
$('#tLinterna').onclick=()=>setTool('linterna');$('#tLupa').onclick=()=>setTool('lupa');
const L=()=>Math.round(Math.min(220,Math.max(130,st.clientWidth*.27)));
function draw(){
  const W=st.clientWidth,H=st.clientHeight,k=W/800,x=px*k,y=py*k,l=L(),z=2.6;
  st.style.setProperty('--x',x+'px');st.style.setProperty('--y',y+'px');st.style.setProperty('--r',Math.max(90,W*.17)+'px');
  lens.style.width=lens.style.height=l+'px';lens.style.transform=`translate(${x-l/2}px,${y-l/2}px)`;
  const[fx,fy]=focus(),gx=fx*k,gy=fy*k;lens.style.backgroundSize=`${W*z}px ${H*z}px`;lens.style.backgroundPosition=`${(l/2-7)-gx*z}px ${(l/2-7)-gy*z}px`;
  if(!busy){const dw=W*.09;DOG.style.transform=`translateX(${300*k-dw/2}px)`}
  if(tool==='lupa'&&!busy){const sr=st.getBoundingClientRect(),dr=DOG.getBoundingClientRect(),c=l/2-7;
    LDOG.style.width=dr.width*z+'px';LDOG.style.transform=`translate(${(dr.left-sr.left)*z+c-gx*z}px,${(dr.top-sr.top)*z+c-gy*z}px)`}
}
let grab=null;
function rel(e){const r=st.getBoundingClientRect();return[(e.clientX-r.left)/r.width*800,(e.clientY-r.top)/r.height*500]}
function toolR(){const W=st.clientWidth,k=W/800;return tool==='lupa'?L()/2/k:Math.max(90,W*.17)*.75/k}
function visR(){const W=st.clientWidth,k=W/800;return tool==='lupa'?L()/2/k:Math.max(90,W*.17)*.8/k}
const clampMove=(x,y)=>{const m=visR()*.4;px=Math.min(800-m,Math.max(m,x));py=Math.min(500-m,Math.max(m,y));draw()};
const GAIN=1.5;
function focus(){if(tool!=='lupa')return[px,py];const m=visR()*.4,f=(v,max)=>Math.min(max,Math.max(0,(v-m)/(max-2*m)*max));return[f(px,800),f(py,500)]}
let placed=false;
st.addEventListener('pointerdown',e=>{
  st.setPointerCapture(e.pointerId);const[x,y]=rel(e);
  if(e.pointerType==='mouse'){grab=[0,0];clampMove(x,y);return}
  if(!placed){const d=toolR()*.68;clampMove(x-d,y-d);placed=true}   // primera vez: el dedo queda en el borde inferior derecho
  grab=[px,py,x,y];                                                  // después: se arrastra desde donde toques, sin recolocarse
});
st.addEventListener('pointermove',e=>{
  const[x,y]=rel(e);
  if(grab&&grab.length===4)clampMove(grab[0]+(x-grab[2])*GAIN,grab[1]+(y-grab[3])*GAIN);else if(grab)clampMove(x,y);
  else if(e.pointerType==='mouse')clampMove(x,y);          // ratón sin pulsar: sigue al puntero
});
['pointerup','pointercancel'].forEach(ev=>st.addEventListener(ev,()=>{grab=null}));
st.addEventListener('keydown',e=>{const s=12,m={ArrowLeft:[-s,0],ArrowRight:[s,0],ArrowUp:[0,-s],ArrowDown:[0,s]}[e.key];if(m){e.preventDefault();clampMove(px+m[0],py+m[1])}});
new ResizeObserver(draw).observe(st);
function reach(){const k=st.clientWidth/800;return tool==='lupa'?(L()/2-7)/2.6/k*.85:Math.max(90,st.clientWidth*.17)*.6/k}
let last=performance.now();
function tick(now){const dt=now-last;last=now;
  if(!busy)for(const c of ITEMS){if(found.includes(c.id)||c.tool==='laika')continue;const[fx,fy]=focus();const near=c.tool===tool&&Math.hypot(fx-c.x,fy-c.y)<reach();dwell[c.id]=near?(dwell[c.id]||0)+dt:0;
    if(dwell[c.id]>450){found.push(c.id);try{localStorage.setItem('hostal-herramientas',JSON.stringify(found))}catch(e){}list();toast('<b>'+c.t+':</b> '+c.d);
      const k=st.clientWidth/800,p=document.createElement('div');p.className='found';p.style.left=c.x*k+'px';p.style.top=c.y*k+'px';st.appendChild(p);setTimeout(()=>p.remove(),1300);
      if(found.length===ITEMS.length)toast('Todo en orden y las herramientas funcionan. A dormir, que mañana empieza lo bueno.')}}
  requestAnimationFrame(tick)}
requestAnimationFrame(tick);
const ICON={horquilla:'<svg viewBox="0 0 40 20"><path d="M2 10 H36 Q39 10 36 13 H6 Q4 14 6 15 H34" stroke="#2a2420" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>',
 zapatilla2:'<svg viewBox="0 0 50 24"><path d="M2 20 q2 -12 18 -12 h18 q10 0 10 8 v4 h-46Z" fill="#6a4a5a"/><ellipse cx="10" cy="16" rx="6" ry="4" fill="#d8c8b8" opacity=".7"/></svg>'};
function showItem(c){if(st.querySelector('[data-item="'+c.id+'"]'))return;const el=document.createElement('div');el.className='item';el.dataset.item=c.id;el.innerHTML=ICON[c.id];el.style.left=c.x/8+'%';el.style.top=c.y/5+'%';st.appendChild(el)}
ITEMS.filter(c=>c.tool==='laika'&&found.includes(c.id)).forEach(showItem);
let lk=0;try{lk=+localStorage.getItem('hostal-laika')||0}catch(e){}
async function laika(){
  if(busy)return;busy=true;st.classList.add('dogs');$('#tLaika').disabled=true;BUB.classList.remove('on');
  const plan=['horquilla','tumbarse','zapatilla2'][lk]||'nada';lk++;try{localStorage.setItem('hostal-laika',lk)}catch(e){}
  const c=ITEMS.find(i=>i.id===plan);
  const W=st.clientWidth,dw=W*.09,k=W/800,home=300*k-dw/2,stop=c?c.x*k-dw*.9:W*(.15+Math.random()*.5),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const go=(a,b,ms)=>{FLIP.style.transform=b<a?'scaleX(-1)':'none';return DOG.animate([{transform:`translateX(${a}px)`},{transform:`translateX(${b}px)`}],{duration:reduce?1:ms,fill:'forwards',easing:'linear'}).finished};
  DOG.classList.add('run');await go(home,W-dw*.8,1400);await go(W-dw*.8,stop,1500);
  DOG.classList.remove('run');DOG.classList.add('sniff');await new Promise(r=>setTimeout(r,reduce?10:1200));DOG.classList.remove('sniff');
  if(c&&!found.includes(c.id)){found.push(c.id);try{localStorage.setItem('hostal-herramientas',JSON.stringify(found))}catch(e){}
    BUB.innerHTML='<b>¡Guau! ¡Guau!</b> '+c.d;showItem(c);list();
    if(found.length===ITEMS.length)toast('Todo en orden y las herramientas funcionan. A dormir, que mañana empieza lo bueno.')}
  else if(plan==='tumbarse'){DOG.classList.add('lie');BUB.textContent='Laika olfatea, olfatea… no encuentra nada y se tumba en la alfombra. Fin del turno.'}
  else BUB.textContent=FUN[fi++%FUN.length];
  BUB.classList.add('on');await new Promise(r=>setTimeout(r,3400));BUB.classList.remove('on');DOG.classList.remove('lie');
  DOG.classList.add('run');await go(stop,home,1200);DOG.classList.remove('run');FLIP.style.transform='none';
  DOG.getAnimations().forEach(a=>a.cancel());busy=false;st.classList.remove('dogs');$('#tLaika').disabled=false;draw();
}
$('#tLaika').onclick=laika;
list();draw();
}
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
