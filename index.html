<style>
/* VOICE: voz en off de novela negra, íntima y con humor
   IDEA: la primera página del expediente: retrato de la detective y su presentación a máquina
   PICTURE: Candela con gabardina y sombrero bajo una farola, el ojo marrón agrandado por la lupa
   COLOUR and TYPE: noche, papel envejecido, rojo del sombrero; Limelight + Special Elite (máquina de escribir)
   LAYOUT: retrato arriba a todo el ancho, el texto se escribe debajo línea a línea, botón al final */
:root{color-scheme:dark;--bg:#0b0908;--ink:#efe6d4;--ink2:#b9aa90;--paper:#ebdfc4;--red:#9a2a22}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Spectral,Georgia,serif;overflow-x:clip}
.wrap{max-width:980px;margin:0 auto;padding:12px max(3vw,10px) 40px}
.pic{position:relative;aspect-ratio:8/5;border:1px solid #2e2520;overflow:hidden;box-shadow:0 20px 60px #000c}
.pic img{width:100%;height:100%;display:block;animation:in 2.4s ease-out both}
@keyframes in{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
.card{margin-top:-10px;position:relative;background:var(--paper);color:#22170f;border-radius:4px;padding:26px clamp(18px,4vw,40px) 24px;box-shadow:0 14px 40px #000c;min-height:340px;cursor:pointer}
.card::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 31px,#8a6f5014 31px 32px);pointer-events:none;border-radius:4px}
.stamp{position:absolute;right:18px;top:-16px;transform:rotate(6deg);border:2px solid var(--red);color:var(--red);font:14px "Special Elite",monospace;padding:2px 10px;background:var(--paper)}
.txt{font:clamp(16px,2.3vw,19px)/1.65 "Special Elite","Courier New",monospace;white-space:pre-wrap;margin:0}
.txt b{font-weight:400;color:var(--red)}
.cur{display:inline-block;width:.55em;height:1.05em;background:#22170f;vertical-align:-.15em;animation:bl .9s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.hint{font-size:13px;color:#7d6a52;margin-top:12px;font-style:italic}
.go{display:none;text-align:center;text-decoration:none;line-height:52px;margin-top:18px;min-height:52px;width:100%;border:0;border-radius:6px;background:#1a120d;color:var(--paper);font:22px Limelight,serif;cursor:pointer}
.go.on{display:block;animation:in 1s ease-out}
.again{background:none;border:0;color:#7d6a52;text-decoration:underline;font:14px Spectral,serif;margin-top:10px;cursor:pointer;min-height:44px}
:focus-visible{outline:3px solid #f6dfae;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.pic img,.go.on{animation:none}.cur{animation:none}}

body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
</style>
</head>

'Una chica normal. Paso los días en la tienda, entre medias y calcetines.',
'Me encanta pasear a mi viejita, Laika.',
'Deportista algunos días; cocinera, otros.',
'',
'Una persona normal…',
'hasta que me ponen un crimen delante.',
'',
'Entonces algo cambia. Me convierto en una detective a la que nada ni nadie puede parar hasta dar con el asesino.',
'',
'Con mi linterna, mi lupa y mi máquina de rastreo, Laika, pegada a los talones, no pienso descansar hasta encontrar al culpable.',
'',
'<b>La Plata, 1927.</b> El caso está a punto de empezar.'
];
const full=LINES.join('\n');
const txt=document.getElementById('txt'),go=document.getElementById('go'),hint=document.getElementById('hint'),again=document.getElementById('again');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let i=0,timer=null,done=false;
// recorre el texto saltando etiquetas enteras
function step(){
  if(i>=full.length){finish();return}
  if(full[i]==='<'){i=full.indexOf('>',i)+1}else i++;
  txt.innerHTML=full.slice(0,i)+'<span class="cur"></span>';
  const c=full[i-1];
  timer=setTimeout(step,c==='\n'?380:c==='.'||c==='…'?260:c===','||c===';'?140:32);
}
function finish(){clearTimeout(timer);done=true;txt.innerHTML=full;go.classList.add('on');hint.hidden=true;again.hidden=false}
function skip(){if(!done)finish()}
document.getElementById('card').addEventListener('click',e=>{if(e.target===go||e.target===again)return;skip()});
document.getElementById('card').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();skip()}});
again.onclick=()=>{i=0;done=false;go.classList.remove('on');hint.hidden=false;again.hidden=true;step()};
if(reduce)finish();else setTimeout(step,1400);
}
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
