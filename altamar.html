<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0908">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Altamar</title>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Special+Elite&family=Spectral:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--paper:#e9dfc7;--ink:#2a2018;--brass:#c9a24a;--red:#8a2a20;--dim:#8a7e6c;--bg:#0b0908}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:#efe6d4;font-family:Spectral,Georgia,serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden}
#app.rot{width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:flex}
/* ---------- calendario ---------- */
#cal{flex-direction:column;align-items:center;justify-content:center;padding:2.5% 3%;background:radial-gradient(ellipse at 50% 40%,#1e1712,#0b0908 70%)}
#cal h1{font-family:Limelight,Georgia,serif;font-weight:400;color:var(--brass);letter-spacing:.35em;margin:0;font-size:clamp(20px,5.2vh,40px);text-shadow:0 0 18px #c9a24a55}
#app.rot #cal h1{font-size:clamp(20px,5.2vw,40px)}
#cal .sub{color:var(--dim);font-style:italic;font-size:13px;margin:.2em 0 .6em}
#cal .cd{color:#e0b66a;font-family:'Special Elite',monospace;font-size:13px;min-height:1.2em;margin-bottom:.4em}
.doors{display:grid;grid-template-columns:repeat(8,1fr);gap:1.4%;width:100%;max-width:880px;flex:1;max-height:72%}
.door{position:relative;border-radius:4px;border:1px solid #2e261e;background:#15110e;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#4a4036;font-size:clamp(14px,3.4vh,26px);padding:0}
.door .t{font-size:9px;letter-spacing:.08em;margin-top:2px;font-family:Spectral,serif}
.door.long{border-color:#5a3a2a}.door.long::before{content:"NOCHE LARGA";position:absolute;top:4px;font-size:7px;letter-spacing:.08em;color:var(--red)}
.door.open{background:#3a2a1c;border:2px solid var(--brass);color:#f3dc9a;box-shadow:0 0 22px #c9a24a55,inset 0 0 0 5px #3a2a1c,inset 0 0 0 6px #6e5320;animation:glow 2.4s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 12px #c9a24a33,inset 0 0 0 5px #3a2a1c,inset 0 0 0 6px #6e5320}to{box-shadow:0 0 28px #c9a24a88,inset 0 0 0 5px #3a2a1c,inset 0 0 0 6px #6e5320}}
.door.done{background:#1a1410;border-color:#3a2e22;color:#9a8a6a}
.door.done .seal{position:absolute;right:5px;bottom:5px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c44,#7a1a12);box-shadow:0 1px 2px #000}
.door.lock svg{width:14px;height:14px;margin-top:2px;opacity:.6}
.calbar{display:flex;gap:12px;margin-top:2.5%}
.postal{display:flex;align-items:center;gap:8px;border:1px solid #6e5320;background:#1d1712;border-radius:4px;padding:8px 14px;color:var(--paper);font-size:14px;text-decoration:none}
.postal svg{width:26px;height:18px}
/* ---------- juego ---------- */
#game{background:#000}
#stageWrap{position:relative;flex:none;display:flex;align-items:center;justify-content:center;background:#000}
.scene{position:relative;overflow:hidden;background:#000}
.scene .lay{position:absolute;inset:0}
.scene .lay svg,.lens svg{width:100%;height:100%;display:block}
.dark{position:absolute;inset:0;background:#000;pointer-events:none}
.lit{opacity:0;-webkit-mask-image:radial-gradient(circle at var(--x,50%) var(--y,50%),#000 0,#000 calc(var(--r,90px)*.4),rgba(0,0,0,.6) calc(var(--r,90px)*.75),transparent var(--r,90px));mask-image:radial-gradient(circle at var(--x,50%) var(--y,50%),#000 0,#000 calc(var(--r,90px)*.4),rgba(0,0,0,.6) calc(var(--r,90px)*.75),transparent var(--r,90px));filter:brightness(1.15)}
.scene.t-linterna .lit{opacity:1}
#base .ol{display:none}#lit .ob{display:none}
.shake{animation:shake .5s}@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.scene.pick{cursor:crosshair}.pring{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:2px dashed #f3dc9a;pointer-events:none;animation:spk 1.2s infinite;z-index:3}
.lens{position:absolute;left:0;top:0;border-radius:50%;overflow:hidden;display:none;border:6px solid var(--brass);box-shadow:0 0 0 2px #5a4318,0 8px 24px #000c;pointer-events:none;z-index:5;background:#000}
.lensH{position:absolute;left:0;top:0;width:12px;height:56px;margin-left:-6px;background:linear-gradient(90deg,#3a2414,#6b4426 50%,#3a2414);border-radius:4px;display:none;pointer-events:none;z-index:4;transform-origin:50% 0}
.scene.t-lupa .lens,.scene.t-lupa .lensH{display:block}
.scene.dogs .lens,.scene.dogs .lensH{display:none!important}.scene.dogs .lit{opacity:0!important}
.hand{position:absolute;width:52px;height:52px;margin:-8px 0 0 -16px;pointer-events:none;opacity:0;z-index:6;filter:drop-shadow(0 3px 4px #000c)}
.hand.on{animation:tap .7s ease-out}
@keyframes tap{0%{opacity:0;transform:translateY(-10px) scale(1.1)}25%{opacity:1;transform:none}45%{transform:scale(.88)}65%{transform:none;opacity:1}100%{opacity:0}}
.ring{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px solid #f3dc9a;pointer-events:none;animation:ping .6s ease-out forwards;z-index:6}
@keyframes ping{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
.spark{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#ffe9a8aa,#ffe9a800 70%);animation:spk 1.6s ease-in-out infinite;z-index:2}
@keyframes spk{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:.9;transform:scale(1.15)}}
/* perras */
.dog{position:absolute;left:0;bottom:4%;width:12.5%;pointer-events:none;z-index:4;display:none}
.dog.on{display:block}
.dog svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 4px 4px #000a) brightness(.85) saturate(.8)}
.dog .leg{transform-box:fill-box;transform-origin:50% 0}
.dog.run .la{animation:trot .28s linear infinite}.dog.run .lb{animation:trot .28s linear infinite reverse}
.dog .tail{transform-box:fill-box;transform-origin:100% 100%;animation:wag .3s ease-in-out infinite alternate}
.dog.sniff .head{transform-box:fill-box;transform-origin:20% 80%;animation:bob .35s ease-in-out infinite alternate}
.dog.eki{width:17%;bottom:2.5%}.dog .tongue{display:none}.dog.happy .tongue{display:block}
.dog.happy .bodyall{animation:hop .32s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes trot{0%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}100%{transform:rotate(22deg)}}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
@keyframes bob{from{transform:rotate(0)}to{transform:rotate(14deg)}}
.dog.lie svg{transform:translateY(22%) scaleY(.7);transform-origin:50% 100%}.dog.lie .leg{display:none}
.bub{position:absolute;left:50%;top:8%;transform:translateX(-50%);max-width:70%;background:var(--paper);color:var(--ink);font-family:'Special Elite',monospace;font-size:14px;line-height:1.35;padding:10px 14px;border-radius:4px;box-shadow:0 6px 20px #000b;opacity:0;transition:opacity .3s;pointer-events:none;z-index:7}
.bub.on{opacity:1}.bub b{color:var(--red)}
/* diálogo */
.dlg{position:absolute;left:3%;right:3%;bottom:3%;display:none;gap:12px;align-items:flex-end;z-index:8}
.dlg.on{display:flex}
.dlg .face{width:21%;max-width:130px;aspect-ratio:1;border-radius:6px;background:#1a1612;border:2px solid var(--brass);overflow:hidden;flex:none;box-shadow:0 6px 20px #000c}
.dlg .face svg{width:100%;height:100%;display:block}
.dlg .card{flex:1;background:var(--paper);color:var(--ink);border-radius:4px;padding:10px 14px 12px;box-shadow:0 6px 24px #000d;position:relative}
.dlg .who{font-family:Limelight,Georgia,serif;color:var(--red);font-size:13px;letter-spacing:.12em;margin-bottom:3px}
.dlg .say{font-family:'Special Elite',monospace;font-size:15px;line-height:1.4}
.dlg .more{position:absolute;right:10px;bottom:4px;font-size:12px;color:var(--dim);animation:spk 1.4s infinite}
.dlg .opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.dlg .opts button{text-align:left;background:#1d1915;color:var(--paper);border:1px solid #4a3e30;border-radius:4px;padding:8px 10px;font-size:14px}
.dlg .opts button.ev{background:#3a2a1c;border-color:var(--brass);color:#f3dc9a}
.shade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .3s;pointer-events:none;z-index:7}
.shade.on{opacity:.4}
/* columna lateral */
.side{flex:1;display:flex;flex-direction:column;padding:8px 8px 6px;gap:6px;background:#0b0908;border-left:1px solid #221b15}
.top{display:flex;align-items:center;gap:8px}
.top .day{font-size:13px;color:#b8a888;line-height:1.15;flex:1}
.top .day b{display:block;font-family:'Special Elite',monospace;color:#e0b66a;font-weight:400;font-size:12px}
.ib{width:38px;height:38px;border-radius:8px;border:1px solid #3a2e22;background:#15110e;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.ib svg{width:22px;height:22px}#sndBtn .x{display:none}#sndBtn.off .x{display:block}#sndBtn.off .w{display:none}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:#a3271c;color:#fff;font-size:11px;display:none;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 0 0 2px #0b0908}
.badge.on{display:flex}
.nar{flex:1 1 0;min-height:48px;background:var(--paper);color:var(--ink);border-radius:4px;padding:7px 9px;font-family:'Special Elite',monospace;font-size:13px;line-height:1.4;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.go{display:block;width:100%;background:#2a1d14;color:#f3dc9a;border:1px solid var(--brass);border-radius:4px;padding:6px;font-family:Spectral,serif;font-size:14px}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;flex:none}#acts{flex:none}.top{flex:none}
.tool{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;padding:0;color:#b8a888;font-size:10px}
.tool .ic{width:min(40px,100%);aspect-ratio:1;height:auto;border-radius:10px;border:1px solid #3a2e22;background:#15110e;display:flex;align-items:center;justify-content:center}
.tool svg{width:22px;height:22px}
.tool[aria-pressed=true] .ic{background:var(--paper);border-color:var(--paper)}
.tool[aria-pressed=true]{color:#f3dc9a}.tool[aria-pressed=true] svg{stroke:#2a2018}
.tool.hid{visibility:hidden}.tool:disabled{opacity:.35}
.tool.new .ic{animation:glow 1s ease-in-out infinite alternate;border-color:var(--brass)}
/* pista nueva */
.clue{position:absolute;left:50%;top:-30%;transform:translateX(-50%);width:min(70%,460px);background:var(--paper);color:var(--ink);border-radius:4px;padding:10px 14px;box-shadow:0 10px 30px #000d;z-index:20;transition:top .45s cubic-bezier(.2,1.3,.4,1)}
.clue.on{top:4%}
.clue .h{font-family:Limelight,Georgia,serif;color:var(--red);font-size:12px;letter-spacing:.15em}
.clue .b{font-family:'Special Elite',monospace;font-size:14px;line-height:1.35;margin-top:3px}
/* cartel de película muda */
#cartel{position:absolute;inset:0;background:#000;z-index:40;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .6s}
#cartel.on{opacity:1;pointer-events:auto}
#cartel div{border:2px solid #b8a888;outline:1px solid #b8a888;outline-offset:6px;padding:18px 34px;font-family:Limelight,Georgia,serif;color:#e9dfc7;letter-spacing:.25em;font-size:clamp(16px,4vh,30px);text-align:center}
/* libreta */
#acts:empty{display:none}#acts{display:flex;flex-direction:column;gap:6px}
.go{animation:glow 1.6s ease-in-out infinite alternate}
.scr{scrollbar-width:none;touch-action:none!important;overscroll-behavior:contain}.scr::-webkit-scrollbar{display:none}
.pickUI{position:absolute;inset:0;z-index:6;display:none}
.pickUI.on{display:block}
.pickUI svg{position:absolute;inset:0;width:100%;height:100%}
.pickUI .turn{position:absolute;right:3%;bottom:5%;width:22%;aspect-ratio:1;border-radius:50%;border:2px solid var(--brass);background:#2a1d14cc;color:#f3dc9a;font-family:Spectral,serif;font-size:14px}
.pickUI .turn.on{background:#c9a24a;color:#2a1d14}
.pickUI .hq{position:absolute;left:3%;top:4%;color:var(--paper);font-family:'Special Elite',monospace;font-size:14px;background:#000a;padding:4px 8px;border-radius:4px}
#lib{position:absolute;inset:0;z-index:30;background:#0b0908ee;display:none;align-items:center;justify-content:center;padding:2.5%}
#lib.on{display:flex}
.book{position:relative;width:100%;height:100%;max-width:980px;background:#2a1d14;border-radius:6px;padding:10px 46px 10px 10px;display:flex}
.pages{flex:1;background:var(--paper);border-radius:2px;color:var(--ink);overflow:auto;padding:14px 18px 18px;background-image:repeating-linear-gradient(transparent 0 25px,#cfc4a8 25px 26px);touch-action:pan-y;-webkit-overflow-scrolling:touch}
.pages h2{font-family:Spectral,serif;font-style:italic;color:var(--red);font-weight:400;margin:0 0 6px;font-size:20px}
.pages h3{font-family:'Special Elite',monospace;font-weight:400;font-size:13px;color:var(--dim);margin:14px 0 4px}
.pages .it{font-family:'Special Elite',monospace;font-size:14px;line-height:26px}
.pages .it b{color:var(--red);font-weight:400}
.pages .no{color:#9a8f7a;font-style:italic}
.tabs{position:absolute;right:0;top:10px;bottom:10px;width:44px;display:flex;flex-direction:column;gap:6px}
.tabs button{flex:1;border:0;border-radius:0 6px 6px 0;background:#7a5a3a;color:var(--ink);writing-mode:vertical-rl;font-size:12px;letter-spacing:.05em;padding:0}
.tabs button.on{background:var(--brass)}
.close{position:absolute;left:-2px;top:-2px;width:40px;height:40px;border-radius:50%;border:1px solid #6e5320;background:#1d1712;color:var(--paper);font-size:20px;z-index:2}
.sus{display:grid;grid-template-columns:1fr auto;gap:0 10px;max-width:420px}
.sus button{border:0;background:none;font-family:'Special Elite',monospace;font-size:14px;line-height:26px;text-align:left;color:var(--ink);padding:0}
.sus .mk{width:26px;text-align:center;color:var(--red);font-size:16px}
.sus .x{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.obj{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.obj .o{width:44px;height:44px;flex:none;border:1px solid #b8aa88;border-radius:4px;background:#ddd2b4;display:flex;align-items:center;justify-content:center;font-size:22px}
/* nota a pantalla completa */
#doc{position:absolute;inset:0;z-index:25;background:#000c;display:none;align-items:center;justify-content:center}
#doc.on{display:flex}
#doc .paper{background:var(--paper);color:var(--ink);padding:24px 30px;max-width:70%;transform:rotate(-2deg);box-shadow:0 14px 40px #000;font-family:'Special Elite',monospace;font-size:20px;line-height:1.5;text-align:center}
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#000d;z-index:21}
</style>
</head>

  <div class="sub">diciembre de 1927 · veinticuatro noches<span id="ver"></span></div>

<g stroke="#ddd2bc" stroke-width="1" fill="none" opacity=".65"><path d="M30 28 q7 5 7 5" /><path d="M38 25 q3 2 7 5" /><path d="M46 24 q4 3 8 6" /><path d="M54 24 q4 3 7 9" /><path d="M62 24 q4 5 8 4" /><path d="M70 25 q5 5 7 5" /><path d="M78 27 q5 2 8 6" /><path d="M34 36 q7 2 10 9" /><path d="M44 34 q5 2 8 6" /><path d="M56 33 q5 5 11 6" /><path d="M68 34 q4 5 9 9" /><path d="M80 36 q4 2 8 4" /><path d="M28 44 q5 5 6 8" /><path d="M50 42 q6 4 9 8" /><path d="M74 44 q3 5 6 9" /></g>

<path d="M84 34 Q84 18 94 12" stroke="#b3a387" stroke-width="16" stroke-linecap="round" fill="none"/>

0 0 0 .83 0 0 0 0 .84 0 0 0 1.1 -.42\"/></filter>\n<filter id=\"b5\"><feGaussianBlur stdDeviation=\"5\"/></filter>\n<filter id=\"paperT\"><feTurbulence type=\"fractalNoise\" baseFrequency=\".8\" numOctaves=\"2\" seed=\"3\"/><feColorMatrix values=\"0 0 0 0 .4 0 0 0 0 .33 0 0 0 0 .22 0 0 0 .22 0\"/><feComposite in2=\"SourceGraphic\" operator=\"in\"/></filter>\n<pattern id=\"cob\" width=\"36\" height=\"16\" patternUnits=\"userSpaceOnUse\"><rect width=\"36\" height=\"16\" fill=\"#3a3530\"/><path d=\"M0 15.5H36M18 0V8M0 7.5H36M9 8V16M27 8V16\" stroke=\"#22201c\" stroke-width=\"1.5\"/></pattern>\n</defs><rect width=\"800\" height=\"500\" fill=\"#0b0908\"/><g transform=\"rotate(1 400 250)\"><rect x=\"96\" y=\"14\" width=\"608\" height=\"476\" fill=\"#e6dcc2\"/><rect x=\"96\" y=\"14\" width=\"608\" height=\"476\" fill=\"#000\" filter=\"url(#paperT)\"/><rect x=\"96\" y=\"14\" width=\"608\" height=\"476\" fill=\"none\" stroke=\"#c9bb98\" stroke-width=\"2\"/><text x=\"400\" y=\"66\" text-anchor=\"middle\" font-family=\"Limelight,Georgia,serif\" font-size=\"46\" fill=\"#1f1a14\" letter-spacing=\"3\">EL FARO DE ALTAMAR</text><path d=\"M116 78H684M116 100H684\" stroke=\"#1f1a14\" stroke-width=\"1.5\"/><text x=\"120\" y=\"94\" font-size=\"11\" fill=\"#1f1a14\" font-family=\"Georgia\">Diario de la mañana</text><text x=\"400\" y=\"94\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1f1a14\" font-family=\"Georgia\">Viernes, 2 de diciembre de 1927</text><text x=\"680\" y=\"94\" text-anchor=\"end\" font-size=\"11\" fill=\"#1f1a14\" font-family=\"Georgia\">10 céntimos</text><text x=\"400\" y=\"138\" text-anchor=\"middle\" font-size=\"25\" textLength=\"560\" lengthAdjust=\"spacingAndGlyphs\" fill=\"#1f1a14\" font-family=\"Georgia\" font-weight=\"bold\">HALLADO MUERTO DON JULIÁN ARRIETA AL PIE DEL FARO</text><path d=\"M116 152H684\" stroke=\"#1f1a14\"/><text x=\"120\" y=\"176\" font-size=\"15.5\" fill=\"#1f1a14\" font-family=\"Georgia\" font-weight=\"bold\">La policía apunta a un suicidio</text><g transform=\"translate(118 186)\"><rect width=\"250\" height=\"104\" fill=\"#d3c7a8\"/><path d=\"M20 100q60-20 120-6t110 6V104H20z\" fill=\"#1f1a14\"/><path d=\"M180 20h22l6 70h-34z\" fill=\"#1f1a14\"/><rect x=\"183\" y=\"10\" width=\"16\" height=\"10\" fill=\"#1f1a14\"/><path d=\"M200 15l46-10v20z\" fill=\"#8a8070\"/><path d=\"M60 84q20-8 50-2l2 8q-28 4-52 0z\" fill=\"#e6dcc2\"/></g><text x=\"120\" y=\"310\" font-size=\"10.5\" fill=\"#1f1a14\" font-family=\"Georgia\">El comisario Ibarra da el caso por cerrado.</text><text x=\"120\" y=\"324\" font-size=\"10.5\" fill=\"#1f1a14\" font-family=\"Georgia\">El doctor Salazar certificó la muerte «a las</text><text x=\"120\" y=\"338\" font-size=\"10.5\" fill=\"#1f1a14\" font-family=\"Georgia\">tres de la madrugada, por la caída». La empresa</text><text x=\"120\" y=\"352\" font-size=\"10.5\" fill=\"#1f1a14\" font-family=\"Georgia\">de Don Julián estaba en la ruina, y los</text><text x=\"120\" y=\"366\" font-size=\"10.5\" fill=\"#1f1a14\" font-family=\"Georgia\">vecinos hablan de un hombre «hundido».</text><path d=\"M382 162V480\" stroke=\"#1f1a14\" stroke-width=\".8\"/><text x=\"396\" y=\"178\" font-size=\"15.5\" fill=\"#1f1a14\" font-family=\"Georgia\" font-weight=\"bold\">La viuda no recibe visitas</text><g transform=\"translate(396 188)\"><rect width=\"286\" height=\"96\" fill=\"#d3c7a8\"/><rect x=\"40\" y=\"30\" width=\"200\" height=\"66\" fill=\"#1f1a14\"/><path d=\"M30 32l110-26 110 26z\" fill=\"#1f1a14\"/><rect x=\"56\" y=\"44\" width=\"16\" height=\"22\" fill=\"#d3c7a8\"/><rect x=\"92\" y=\"44\" width=\"16\" height=\"22\" fill=\"#d3c7a8\"/><rect x=\"128\" y=\"44\" width=\"16\" height=\"22\" fill=\"#d3c7a8\"/><rect x=\"164\" y=\"44\" width=\"16\" height=\"22\" fill=\"#d3c7a8\"/><rect x=\"200\" y=\"44\" width=\"16\" height=\"22\" fill=\"#d3c7a8\"/><rect x=\"236\" y=\"44\" width=\"16\" height=\"22\" fill=\"#d3c7a8\"/><rect x=\"128\" y=\"70\" width=\"28\" height=\"26\" fill=\"#d3c7a8\"/></g><text x=\"396\" y=\"304\" font-size=\"10.5\" fill=\"#1f1a14\" font-family=\"Georgia\">Doña Leonor Arrieta guarda luto en el palacete.</text><text x=\"396\" y=\"318\" font-size=\"10.5\" fill=\"#1f1a14\" font-family=\"Georgia\">Se comenta en el barrio que el seguro de vida</text><text x=\"396\" y=\"332\" font-size=\"10.5\" fill=\"#1f1a14\" font-family=\"Georgia\">de Don Julián se subió hace apenas un mes.</text><text x=\"396\" y=\"346\" font-size=\"10.5\" fill=\"#1f1a14\" font-family=\"Georgia\">Su hijo Íñigo no ha querido hablar con este</text><text x=\"396\" y=\"360\" font-size=\"10.5\" fill=\"#1f1a14\" font-family=\"Georgia\">diario. Su hija Clara, tampoco.</text><rect x=\"118\" y=\"386\" width=\"250\" height=\"90\" fill=\"none\" stroke=\"#1f1a14\"/><text x=\"243\" y=\"402\" text-anchor=\"middle\" font-size=\"8\" fill=\"#1f1a14\" font-family=\"Georgia\" font-weight=\"bold\">POMPAS FÚNEBRES OLAZABAL</text><text x=\"243\" y=\"414\" text-anchor=\"middle\" font-size=\"5.2\" fill=\"#1f1a14\" font-family=\"Georgia\">Coches de caballos y de motor.</text><text x=\"243\" y=\"422\" text-anchor=\"middle\" font-size=\"5.2\" fill=\"#1f1a14\" font-family=\"Georgia\">Discreción absoluta. Calle del Farol, 3.</text><path d=\"M136 430H350\" stroke=\"#1f1a14\" stroke-width=\".6\"/><text x=\"243\" y=\"446\" text-anchor=\"middle\" font-size=\"7.5\" fill=\"#1f1a14\" font-family=\"Georgia\" font-weight=\"bold\">SIDRERÍA EL ANCLA</text><text x=\"243\" y=\"457\" text-anchor=\"middle\" font-size=\"5.2\" fill=\"#1f1a14\" font-family=\"Georgia\">Esta noche, bertsolaris. Se fía a los huelguistas.</text><rect x=\"396\" y=\"386\" width=\"286\" height=\"90\" fill=\"#ddd2b4\" stroke=\"#1f1a14\"/><text x=\"539\" y=\"402\" text-anchor=\"middle\" font-size=\"8\" fill=\"#1f1a14\" font-family=\"Georgia\" font-weight=\"bold\">ECOS DEL BARRIO</text><text x=\"539\" y=\"418\" text-anchor=\"middle\" font-size=\"5.6\" fill=\"#1f1a14\" font-family=\"Georgia\" font-style=\"italic\">Una señorita argentina fue vista ayer en el faro,</text><text x=\"539\" y=\"428\" text-anchor=\"middle\" font-size=\"5.6\" fill=\"#1f1a14\" font-family=\"Georgia\" font-style=\"italic\">tomando notas junto al cuerpo. Doña Puri insiste:</text><text x=\"539\" y=\"438\" text-anchor=\"middle\" font-size=\"5.6\" fill=\"#1f1a14\" font-family=\"Georgia\" font-style=\"italic\">«formal, lo que se dice formal, no es». Los</text><text x=\"539\" y=\"448\" text-anchor=\"middle\" font-size=\"5.6\" fill=\"#1f1a14\" font-family=\"Georgia\" font-style=\"italic\">estibadores, en asamblea hoy a mediodía en el muelle.</text><text x=\"539\" y=\"468\" text-anchor=\"middle\" font-size=\"5\" fill=\"#1f1a14\" font-family=\"Georgia\">Mar de fondo. Niebla por la mañana. Pleamar a las 2:10.</text></g></svg>", "muelle": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 500\" preserveAspectRatio=\"none\"><defs>\n<linearGradient id=\"skyD\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#3a4550\"/><stop offset=\".55\" stop-color=\"#8d8f8a\"/><stop offset=\"1\" stop-color=\"#c9b48e\"/></linearGradient>\n<radialGradient id=\"warm\"><stop offset=\"0\" stop-color=\"#ffcf80\" stop-opacity=\".85\"/><stop offset=\".4\" stop-color=\"#ffb757\" stop-opacity=\".28\"/><stop offset=\"1\" stop-color=\"#ff9a30\" stop-opacity=\"0\"/></radialGradient>\n<radialGradient id=\"vig\" cx=\".5\" cy=\".5\" r=\".75\"><stop offset=\".55\" stop-color=\"#000\" stop-opacity=\"0\"/><stop offset=\"1\" stop-color=\"#000\" stop-opacity=\".8\"/></radialGradient>\n<linearGradient id=\"coatA\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"><stop offset=\"0\" stop-color=\"#3a3f48\"/><stop offset=\".5\" stop-color=\"#2a2e35\"/><stop offset=\"1\" stop-color=\"#15171b\"/></linearGradient>\n<linearGradient id=\"coatC\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"><stop offset=\"0\" stop-color=\"#9a8a6a\"/><stop offset=\".5\" stop-color=\"#7a6c52\"/><stop offset=\"1\" stop-color=\"#3e362a\"/></linearGradient>\n<linearGradient id=\"skin\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"> 25\" textLength=\"560\" lengthAdjust=\"spacingAndGlyphs\" fill=\"#1f1a14\" font-family=\"Georgia\" font-weight=\"bold\">VELATORIO DE DON JULIÁN, HOY EN EL PALACETE</text><path d=\"M116 152H684\" stroke=\"#1f1a14\"/><text x=\"120\" y=\"176\" font-size=\"15.5\" fill=\"#1f1a14\" font-family=\"Georgia\" font-weight=\"bold\">El barrio despide a Arrieta</text><g transform=\"translate(118 186)\"><rect width=\"250\" height=\"104\" fill=\"#d3c7a8\"/><rect x=\"80\" y=\"40\" width=\"90\" height=\"40\" fill=\"#1f1a14\"/><path d=\"M70 40h110l-10-8h-90z\" fill=\"#1f1a14\"/><rect x=\"60\" y=\"20\" width=\"4\" height=\"20\" fill=\"#1f1a14\"/><path d=\"M62 12q4 4 0 8q-4-4 0-8z\" fill=\"#1f1a14\"/><rect x=\"190\" y=\"20\" width=\"4\" height=\"20\" fill=\"#1f1a14\"/><path d=\"M192 12q4 4 0 8q-4-4 0-8z\" fill=\"#1f1a14\"/><path d=\"M20 100q105-14 210 0\" stroke=\"#1f1a14\" stroke-width=\"3\" fill=\"none\"/></g><text x=\"120\" y=\"310\" font-size=\"10.5\" fill=\"#1f1a14\" font-family=\"Georgia\">La capilla ardiente se abre hoy de diez a</text><text x=\"120\" y=\"324\" font-size=\"10.5\" fill=\"#1f1a14\" font-family=\"Georgia\">dos en el palacete de la familia. El entierro,</text><text x=\"120\" y=\"338\" font-size=\"10.5\" fill=\"#1f1a14\" font-family=\"Georgia\">mañana a las once. Se espera a medio Altamar:</text><text x=\"120\" y=\"352\" font-size=\"10.5\" fill=\"#1f1a14\" font-family=\"Georgia\">unos por respeto, otros por curiosidad, y</text><text x=\"120\" y=\"366\" font-size=\"10.5\" fill=\"#1f1a14\" font-family=\"Georgia\">algunos, dicen, para asegurarse.</text><path d=\"M382 162V480\" stroke=\"#1f1a14\" stroke-width=\".8\"/><text x=\"396\" y=\"178\" font-size=\"15.5\" fill=\"#1f1a14\" font-family=\"Georgia\" font-weight=\"bold\">¿Quién heredará la conservera?</text><g transform=\"translate(396 188)\"><rect width=\"286\" height=\"96\" fill=\"#d3c7a8\"/><rect x=\"90\" y=\"16\" width=\"100\" height=\"70\" fill=\"#1f1a14\"/><rect x=\"104\" y=\"28\" width=\"72\" height=\"8\" fill=\"#d3c7a8\"/><rect x=\"104\" y=\"44\" width=\"60\" height=\"4\" fill=\"#d3c7a8\"/><rect x=\"104\" y=\"54\" width=\"66\" height=\"4\" fill=\"#d3c7a8\"/><circle cx=\"160\" cy=\"74\" r=\"8\" fill=\"#a3271c\"/></g><text x=\"396\" y=\"304\" font-size=\"10.5\" fill=\"#1f1a14\" font-family=\"Georgia\">El notario Etxeberria guarda silencio. Se</text><text x=\"396\" y=\"318\" font-size=\"10.5\" fill=\"#1f1a14\" font-family=\"Georgia\">rumorea que Don Julián cambió el testamento</text><text x=\"396\" y=\"332\" font-size=\"10.5\" fill=\"#1f1a14\" font-family=\"Georgia\">días antes de morir. La familia lo niega.</text><text x=\"396\" y=\"346\" font-size=\"10.5\" fill=\"#1f1a14\" font-family=\"Georgia\">Íñigo Arrieta, el heredero, fue visto anoche</text><text x=\"396\" y=\"360\" font-size=\"10.5\" fill=\"#1f1a14\" font-family=\"Georgia\">otra vez en el Casino.</text><rect x=\"118\" y=\"386\" width=\"250\" height=\"90\" fill=\"none\" stroke=\"#1f1a14\"/><text x=\"243\" y=\"402\" text-anchor=\"middle\" font-size=\"8\" fill=\"#1f1a14\" font-family=\"Georgia\" font-weight=\"bold\">JOYERÍA ZUBELDIA</text><text x=\"243\" y=\"414\" text-anchor=\"middle\" font-size=\"5.2\" fill=\"#1f1a14\" font-family=\"Georgia\">Compramos oro y alhajas al mejor precio.</text><text x=\"243\" y=\"422\" text-anchor=\"middle\" font-size=\"5.2\" fill=\"#1f1a14\" font-family=\"Georgia\">Discreción. Pago en el acto.</text><path d=\"M136 430H350\" stroke=\"#1f1a14\" stroke-width=\".6\"/><text x=\"243\" y=\"446\" text-anchor=\"middle\" font-size=\"7.5\" fill=\"#1f1a14\" font-family=\"Georgia\" font-weight=\"bold\">FLORISTERÍA LAS DALIAS</text><text x=\"243\" y=\"457\" text-anchor=\"middle\" font-size=\"5.2\" fill=\"#1f1a14\" font-family=\"Georgia\">Coronas y ramos para todo momento. Servicio nocturno.</text><rect x=\"396\" y=\"386\" width=\"286\" height=\"90\" fill=\"#ddd2b4\" stroke=\"#1f1a14\"/><text x=\"539\" y=\"402\" text-anchor=\"middle\" font-size=\"8\" fill=\"#1f1a14\" font-family=\"Georgia\" font-weight=\"bold\">ECOS DEL BARRIO</text><text x=\"539\" y=\"418\" text-anchor=\"middle\" font-size=\"5.6\" fill=\"#1f1a14\" font-family=\"Georgia\" font-style=\"italic\">Doña Puri irá al velatorio «a dar el pésame».</text><text x=\"539\" y=\"428\" text-anchor=\"middle\" font-size=\"5.6\" fill=\"#1f1a14\" font-family=\"Georgia\" font-style=\"italic\">Lleva la libreta nueva en el bolso. La señorita</text><text x=\"539\" y=\"438\" text-anchor=\"middle\" font-size=\"5.6\" fill=\"#1f1a14\" font-family=\"Georgia\" font-style=\"italic\">argentina, nos dicen, también irá, del brazo</text><text x=\"539\" y=\"448\" text-anchor=\"middle\" font-size=\"5.6\" fill=\"#1f1a14\" font-family=\"Georgia\" font-style=\"italic\">del sereno. Habrá que verlo.</text><text x=\"539\" y=\"468\" text-anchor=\"middle\" font-size=\"5\" fill=\"#1f1a14\" font-family=\"Georgia\">Mar en calma. Niebla al alba. Pleamar a las 3:30.</text></g></svg>", "salon": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 500\" preserveAspectRatio=\"none\"><defs>\n<linearGradient id=\"skyD\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#3a4550\"/><stop offset=\".55\" stop-color=\"#8d8f8a\"/><stop offset=\"1\" stop-color=\"#c9b48e\"/></linearGradient>\n<radialGradient id=\"warm\"><stop offset=\"0\" stop-color=\"#ffcf80\" stop-opacity=\".85\"/><stop offset=\".4\" stop-color=\"#ffb757\" stop-opacity=\".28\"/><stop offset=\"1\" stop-color=\"#ff9a30\" stop-opacity=\"0\"/></radialGradient>\n<radialGradient id=\"vig\" cx=\".5\" cy=\".5\" r=\".75\"><stop offset=\".55\" stop-color=\"#000\" stop-opacity=\"0\"/><stop offset=\"1\" stop-color=\"#000\" stop-opacity=\".8\"/></radialGradient>\n<linearGradient id=\"coatA\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"><stop offset=\"0\" stop-color=\"#3a3f48\"/><stop offset=\".5\" stop-color=\"#2a2e35\"/><stop offset=\"1\" stop-color=\"#15171b\"/></linearGradient>\n<linearGradient id=\"coatC\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"><stop offset=\"0\" stop-color=\"#9a8a6a\"/ {svg:SVG.topo,dark:.28,laikaHome:395,laikaStand:1,cartel:'DONOSTIA<br>ESTACIÓN DEL TOPO',

  {id:'aitor',tool:'mano',x:690,y:250,r:80,glow:()=>!D(1).flags.saludo,act:async()=>{
    const f=D(1).flags;
    if(f.saludo){await talk('Aitor','Vamos, que en casa hay café. Y alguien que se muere por conocerte.');endTalk();return}
    const c=await choose('Candela','Gorra, farol, chuzo… y cara de no haber dormido. Es él. ¿Cómo lo saludo?',['«¿Aitor?»','Darle la mano, muy formal','Abrazarlo sin pensar']);

    if(c===1)await talk('Aitor','(Te estrecha la mano muy serio… y luego se ríe.) Qué formales somos los dos.');
    if(c===2)await talk('Aitor','(Se queda rígido un segundo, con el farol en una mano y el chuzo en la otra. Luego te abraza.) …Hola.');
    await talk('Aitor','Tú debes de ser Candela. Escribes mejor de lo que yo hablo.');
    await talk('Aitor','Vivo en Altamar, el barrio del puerto. Para el resto de Donostia somos «los de abajo». Ya verás: tiene su encanto… y sus cosas raras.');

    persona('Aitor','El sereno de Altamar. Me esperaba en el andén del Topo, con el farol todavía encendido.');
    persona('Aitor','Dice que Altamar «tiene su encanto… y sus cosas raras».');

if(ALL){$('#ver').textContent=' · versión de prueba 50';const r=$('#calReset');r.style.display='';r.onclick=()=>{if(r.dataset.ok){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}else{r.dataset.ok=1;r.textContent='¿Seguro? Toca otra vez';setTimeout(()=>{delete r.dataset.ok;r.textContent='↺ Empezar desde cero'},3000)}}}
// arrastrar con el dedo para leer (funciona también con la pantalla girada)
document.querySelectorAll('.scr').forEach(el=>{let last=null,id=null,vel=0,raf=0;
  el.addEventListener('pointerdown',e=>{last=toApp(e.clientX,e.clientY)[1];id=e.pointerId;vel=0;cancelAnimationFrame(raf)});
  el.addEventListener('pointermove',e=>{if(e.pointerId!==id||last==null)return;const y=toApp(e.clientX,e.clientY)[1];vel=last-y;el.scrollTop+=vel;last=y});
  const up=()=>{if(last==null)return;last=null;id=null;const glide=()=>{if(Math.abs(vel)<.5)return;el.scrollTop+=vel;vel*=.92;raf=requestAnimationFrame(glide)};glide()};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up)});
layout();drawCal();show('cal');
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
