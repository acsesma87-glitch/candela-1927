<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0908">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Altamar</title>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Special+Elite&family=Spectral:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--paper:#e9dfc7;--ink:#2a2018;--brass:#c9a24a;--red:#8a2a20;--dim:#8a7e6c;--bg:#0b0908}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:#efe6d4;font-family:Spectral,Georgia,serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden}
#app.rot{width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:flex}
/* ---------- calendario ---------- */
#cal{flex-direction:column;align-items:center;justify-content:center;padding:2.5% 3%;background:radial-gradient(ellipse at 50% 40%,#1e1712,#0b0908 70%)}
#cal h1{font-family:Limelight,Georgia,serif;font-weight:400;color:var(--brass);letter-spacing:.35em;margin:0;font-size:clamp(20px,5.2vh,40px);text-shadow:0 0 18px #c9a24a55}
#app.rot #cal h1{font-size:clamp(20px,5.2vw,40px)}
#cal .sub{color:var(--dim);font-style:italic;font-size:13px;margin:.2em 0 .6em}
#cal .cd{color:#e0b66a;font-family:'Special Elite',monospace;font-size:13px;min-height:1.2em;margin-bottom:.4em}
.doors{display:grid;grid-template-columns:repeat(8,1fr);gap:1.4%;width:100%;max-width:880px;flex:1;max-height:72%}
.door{position:relative;border-radius:4px;border:1px solid #2e261e;background:#15110e;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#4a4036;font-size:clamp(14px,3.4vh,26px);padding:0}
.door .t{font-size:9px;letter-spacing:.08em;margin-top:2px;font-family:Spectral,serif}
.door.long{border-color:#5a3a2a}.door.long::before{content:"NOCHE LARGA";position:absolute;top:4px;font-size:7px;letter-spacing:.08em;color:var(--red)}
.door.open{background:#3a2a1c;border:2px solid var(--brass);color:#f3dc9a;box-shadow:0 0 22px #c9a24a55,inset 0 0 0 5px #3a2a1c,inset 0 0 0 6px #6e5320;animation:glow 2.4s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 12px #c9a24a33,inset 0 0 0 5px #3a2a1c,inset 0 0 0 6px #6e5320}to{box-shadow:0 0 28px #c9a24a88,inset 0 0 0 5px #3a2a1c,inset 0 0 0 6px #6e5320}}
.door.done{background:#1a1410;border-color:#3a2e22;color:#9a8a6a}
.door.done .seal{position:absolute;right:5px;bottom:5px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#c44,#7a1a12);box-shadow:0 1px 2px #000}
.door.lock svg{width:14px;height:14px;margin-top:2px;opacity:.6}
.calbar{display:flex;gap:12px;margin-top:2.5%}
.postal{display:flex;align-items:center;gap:8px;border:1px solid #6e5320;background:#1d1712;border-radius:4px;padding:8px 14px;color:var(--paper);font-size:14px;text-decoration:none}
.postal svg{width:26px;height:18px}
/* ---------- juego ---------- */
#game{background:#000}
#stageWrap{position:relative;flex:none;display:flex;align-items:center;justify-content:center;background:#000}
.scene{position:relative;overflow:hidden;background:#000}
.scene .lay{position:absolute;inset:0}
.scene .lay svg,.lens svg{width:100%;height:100%;display:block}
.dark{position:absolute;inset:0;background:#000;pointer-events:none}
.lit{opacity:0;-webkit-mask-image:radial-gradient(circle at var(--x,50%) var(--y,50%),#000 0,#000 calc(var(--r,90px)*.4),rgba(0,0,0,.6) calc(var(--r,90px)*.75),transparent var(--r,90px));mask-image:radial-gradient(circle at var(--x,50%) var(--y,50%),#000 0,#000 calc(var(--r,90px)*.4),rgba(0,0,0,.6) calc(var(--r,90px)*.75),transparent var(--r,90px));filter:brightness(1.15)}
.scene.t-linterna .lit{opacity:1}
#base .ol{display:none}#lit .ob{display:none}
.shake{animation:shake .5s}@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.scene.pick{cursor:crosshair}.pring{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:2px dashed #f3dc9a;pointer-events:none;animation:spk 1.2s infinite;z-index:3}
.lens{position:absolute;left:0;top:0;border-radius:50%;overflow:hidden;display:none;border:6px solid var(--brass);box-shadow:0 0 0 2px #5a4318,0 8px 24px #000c;pointer-events:none;z-index:5;background:#000}
.lensH{position:absolute;left:0;top:0;width:12px;height:56px;margin-left:-6px;background:linear-gradient(90deg,#3a2414,#6b4426 50%,#3a2414);border-radius:4px;display:none;pointer-events:none;z-index:4;transform-origin:50% 0}
.scene.t-lupa .lens,.scene.t-lupa .lensH{display:block}
.scene.dogs .lens,.scene.dogs .lensH{display:none!important}.scene.dogs .lit{opacity:0!important}
.hand{position:absolute;width:52px;height:52px;margin:-8px 0 0 -16px;pointer-events:none;opacity:0;z-index:6;filter:drop-shadow(0 3px 4px #000c)}
.hand.on{animation:tap .7s ease-out}
@keyframes tap{0%{opacity:0;transform:translateY(-10px) scale(1.1)}25%{opacity:1;transform:none}45%{transform:scale(.88)}65%{transform:none;opacity:1}100%{opacity:0}}
.ring{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px solid #f3dc9a;pointer-events:none;animation:ping .6s ease-out forwards;z-index:6}
@keyframes ping{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
.spark{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#ffe9a8aa,#ffe9a800 70%);animation:spk 1.6s ease-in-out infinite;z-index:2}
@keyframes spk{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:.9;transform:scale(1.15)}}
/* perras */
.dog{position:absolute;left:0;bottom:4%;width:12.5%;pointer-events:none;z-index:4;display:none}
.dog.on{display:block}
.dog svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 4px 4px #000a) brightness(.85) saturate(.8)}
.dog .leg{transform-box:fill-box;transform-origin:50% 0}
.dog.run .la{animation:trot .28s linear infinite}.dog.run .lb{animation:trot .28s linear infinite reverse}
.dog .tail{transform-box:fill-box;transform-origin:100% 100%;animation:wag .3s ease-in-out infinite alternate}
.dog.sniff .head{transform-box:fill-box;transform-origin:20% 80%;animation:bob .35s ease-in-out infinite alternate}
.dog.eki{width:17%;bottom:2.5%}.dog .tongue{display:none}.dog.happy .tongue{display:block}
.dog.happy .bodyall{animation:hop .32s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes trot{0%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}100%{transform:rotate(22deg)}}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
@keyframes bob{from{transform:rotate(0)}to{transform:rotate(14deg)}}
.dog.lie svg{transform:translateY(22%) scaleY(.7);transform-origin:50% 100%}.dog.lie .leg{display:none}
.bub{position:absolute;left:50%;top:8%;transform:translateX(-50%);max-width:70%;background:var(--paper);color:var(--ink);font-family:'Special Elite',monospace;font-size:14px;line-height:1.35;padding:10px 14px;border-radius:4px;box-shadow:0 6px 20px #000b;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.bub.on{opacity:1}.bub b{color:var(--red)}
/* diálogo */
.dlg{position:absolute;left:3%;right:3%;bottom:3%;display:none;gap:12px;align-items:flex-end;z-index:8}
.dlg.on{display:flex}
.dlg .face{width:21%;max-width:130px;aspect-ratio:1;border-radius:6px;background:#1a1612;border:2px solid var(--brass);overflow:hidden;flex:none;box-shadow:0 6px 20px #000c}
.dlg .face svg{width:100%;height:100%;display:block}
.dlg .card{flex:1;background:var(--paper);color:var(--ink);border-radius:4px;padding:10px 14px 12px;box-shadow:0 6px 24px #000d;position:relative}
.dlg .who{font-family:Limelight,Georgia,serif;color:var(--red);font-size:13px;letter-spacing:.12em;margin-bottom:3px}
.dlg .say{font-family:'Special Elite',monospace;font-size:15px;line-height:1.4}
.dlg .more{position:absolute;right:10px;bottom:4px;font-size:12px;color:var(--dim);animation:spk 1.4s infinite}
.dlg .opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.dlg .opts button{text-align:left;background:#1d1915;color:var(--paper);border:1px solid #4a3e30;border-radius:4px;padding:8px 10px;font-size:14px}
.dlg .opts button.ev{background:#3a2a1c;border-color:var(--brass);color:#f3dc9a}
.shade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .3s;pointer-events:none;z-index:7}
.shade.on{opacity:.4}
/* columna lateral */
.side{flex:1;display:flex;flex-direction:column;padding:8px 8px 6px;gap:6px;background:#0b0908;border-left:1px solid #221b15}
.top{display:flex;align-items:center;gap:8px}
.top .day{font-size:13px;color:#b8a888;line-height:1.15;flex:1}
.top .day b{display:block;font-family:'Special Elite',monospace;color:#e0b66a;font-weight:400;font-size:12px}
.ib{width:38px;height:38px;border-radius:8px;border:1px solid #3a2e22;background:#15110e;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.ib svg{width:22px;height:22px}#sndBtn .x{display:none}#sndBtn.off .x{display:block}#sndBtn.off .w{display:none}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:#a3271c;color:#fff;font-size:11px;display:none;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 0 0 2px #0b0908}
.badge.on{display:flex}
.nar{flex:1 1 0;min-height:48px;background:var(--paper);color:var(--ink);border-radius:4px;padding:7px 9px;font-family:'Special Elite',monospace;font-size:13px;line-height:1.4;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.go{display:block;width:100%;background:#2a1d14;color:#f3dc9a;border:1px solid var(--brass);border-radius:4px;padding:6px;font-family:Spectral,serif;font-size:14px}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;flex:none}#acts{flex:none}.top{flex:none}
.tool{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;padding:0;color:#b8a888;font-size:10px}
.tool .ic{width:min(40px,100%);aspect-ratio:1;height:auto;border-radius:10px;border:1px solid #3a2e22;background:#15110e;display:flex;align-items:center;justify-content:center}
.tool svg{width:22px;height:22px}
.tool[aria-pressed=true] .ic{background:var(--paper);border-color:var(--paper)}
.tool[aria-pressed=true]{color:#f3dc9a}.tool[aria-pressed=true] svg{stroke:#2a2018}
.tool.hid{visibility:hidden}.tool:disabled{opacity:.35}
.tool.new .ic{animation:glow 1s ease-in-out infinite alternate;border-color:var(--brass)}
/* pista nueva */
.clue{position:absolute;left:50%;top:-30%;transform:translateX(-50%);width:min(70%,460px);background:var(--paper);color:var(--ink);border-radius:4px;padding:10px 14px;box-shadow:0 10px 30px #000d;z-index:20;transition:top .45s cubic-bezier(.2,1.3,.4,1)}
.clue.on{top:4%}
.clue .h{font-family:Limelight,Georgia,serif;color:var(--red);font-size:12px;letter-spacing:.15em}
.clue .b{font-family:'Special Elite',monospace;font-size:14px;line-height:1.35;margin-top:3px}
/* cartel de película muda */
#cartel{position:absolute;inset:0;background:#000;z-index:40;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .6s}
#cartel.on{opacity:1;pointer-events:auto}
#cartel div{border:2px solid #b8a888;outline:1px solid #b8a888;outline-offset:6px;padding:18px 34px;font-family:Limelight,Georgia,serif;color:#e9dfc7;letter-spacing:.25em;font-size:clamp(16px,4vh,30px);text-align:center}
/* libreta */
#acts:empty{display:none}#acts{display:flex;flex-direction:column;gap:6px}
.go{animation:glow 1.6s ease-in-out infinite alternate}
.scr{scrollbar-width:none;touch-action:none!important;overscroll-behavior:contain}.scr::-webkit-scrollbar{display:none}
.pickUI{position:absolute;inset:0;z-index:6;display:none}
.pickUI.on{display:block}
.pickUI svg{position:absolute;inset:0;width:100%;height:100%}
.pickUI .turn{position:absolute;right:3%;bottom:5%;width:22%;aspect-ratio:1;border-radius:50%;border:2px solid var(--brass);background:#2a1d14cc;color:#f3dc9a;font-family:Spectral,serif;font-size:14px}
.pickUI .turn.on{background:#c9a24a;color:#2a1d14}
.pickUI .hq{position:absolute;left:3%;top:4%;color:var(--paper);font-family:'Special Elite',monospace;font-size:14px;background:#000a;padding:4px 8px;border-radius:4px}
#lib{position:absolute;inset:0;z-index:30;background:#0b0908ee;display:none;align-items:center;justify-content:center;padding:2.5%}
#lib.on{display:flex}
.book{position:relative;width:100%;height:100%;max-width:980px;background:#2a1d14;border-radius:6px;padding:10px 46px 10px 10px;display:flex}
.pages{flex:1;background:var(--paper);border-radius:2px;color:var(--ink);overflow:auto;padding:14px 18px 18px;background-image:repeating-linear-gradient(transparent 0 25px,#cfc4a8 25px 26px);touch-action:pan-y;-webkit-overflow-scrolling:touch}
.pages h2{font-family:Spectral,serif;font-style:italic;color:var(--red);font-weight:400;margin:0 0 6px;font-size:20px}
.pages h3{font-family:'Special Elite',monospace;font-weight:400;font-size:13px;color:var(--dim);margin:14px 0 4px}
.pages .it{font-family:'Special Elite',monospace;font-size:14px;line-height:26px}
.pages .it b{color:var(--red);font-weight:400}
.pages .no{color:#9a8f7a;font-style:italic}
.tabs{position:absolute;right:0;top:10px;bottom:10px;width:44px;display:flex;flex-direction:column;gap:6px}
.tabs button{flex:1;border:0;border-radius:0 6px 6px 0;background:#7a5a3a;color:var(--ink);writing-mode:vertical-rl;font-size:12px;letter-spacing:.05em;padding:0}
.tabs button.on{background:var(--brass)}
.close{position:absolute;left:-2px;top:-2px;width:40px;height:40px;border-radius:50%;border:1px solid #6e5320;background:#1d1712;color:var(--paper);font-size:20px;z-index:2}
.sus{display:grid;grid-template-columns:1fr auto;gap:0 10px;max-width:420px}
.sus button{border:0;background:none;font-family:'Special Elite',monospace;font-size:14px;line-height:26px;text-align:left;color:var(--ink);padding:0}
.sus .mk{width:26px;text-align:center;color:var(--red);font-size:16px}
.sus .x{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.obj{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.obj .o{width:44px;height:44px;flex:none;border:1px solid #b8aa88;border-radius:4px;background:#ddd2b4;display:flex;align-items:center;justify-content:center;font-size:22px}
/* nota a pantalla completa */
#doc{position:absolute;inset:0;z-index:25;background:#000c;display:none;align-items:center;justify-content:center}
#doc.on{display:flex}
#doc .paper{background:var(--paper);color:var(--ink);padding:24px 30px;max-width:70%;transform:rotate(-2deg);box-shadow:0 14px 40px #000;font-family:'Special Elite',monospace;font-size:20px;line-height:1.5;text-align:center}
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#000d;z-index:21}

/* ===== Animaciones ligeras (tanda 1: siempre) ===== */
#st .a-llama{transform-box:fill-box;transform-origin:50% 100%;animation:llama 1.3s ease-in-out infinite alternate}
@keyframes llama{0%{transform:scale(1,1)}35%{transform:scale(.92,1.08) skewX(3deg)}70%{transform:scale(1.04,.95) skewX(-2deg)}100%{transform:scale(.96,1.05)}}
#st .a-brillo{animation:brillo 2.2s ease-in-out infinite alternate}
@keyframes brillo{0%{opacity:1}50%{opacity:.82}100%{opacity:.95}}
#st .a-humo{transform-box:fill-box;transform-origin:50% 100%;animation:humo 3.4s ease-in-out infinite}
@keyframes humo{0%{transform:translateY(8px) scale(.9);opacity:0}30%{opacity:1}100%{transform:translateY(-16px) scale(1.15);opacity:0}}
#st .a-humoC{animation:humoC 3s ease-out infinite}
@keyframes humoC{0%{transform:translateY(4px);opacity:0}30%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
#st .a-vapor{transform-box:fill-box;transform-origin:50% 100%;animation:vapor 2.6s ease-in-out infinite}
@keyframes vapor{0%{transform:scale(.85);opacity:.5}40%{transform:scale(1.08);opacity:1}100%{transform:scale(1.2) translateY(-10px);opacity:.3}}
#st .a-ralenti{animation:ralenti .18s linear infinite alternate}
@keyframes ralenti{from{transform:translateY(0)}to{transform:translateY(-1px)}}
#st .a-haz{transform-box:view-box;transform-origin:676px 30px;animation:haz 6s ease-in-out infinite alternate}
@keyframes haz{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}
#st .a-olas{animation:olas 5s linear infinite}
@keyframes olas{from{transform:translateX(0)}to{transform:translateX(60px)}}
#st .a-agua{animation:agua 7s linear infinite}
@keyframes agua{from{transform:translateX(0)}to{transform:translateX(80px)}}
#st .a-barca{transform-box:fill-box;transform-origin:50% 100%;animation:barca 3.6s ease-in-out infinite alternate}
@keyframes barca{0%{transform:translateY(0) rotate(-1.2deg)}100%{transform:translateY(3px) rotate(1.2deg)}}
#st .a-gaviota{animation:gaviota 16s linear infinite}
@keyframes gaviota{0%{transform:translate(-60px,120px)}45%{transform:translate(860px,70px)}100%{transform:translate(860px,70px)}}
#st .a-lampara{transform-box:view-box;animation:lampara 3.2s ease-in-out infinite alternate}
@keyframes lampara{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
#st .a-escoba{transform-box:view-box;transform-origin:600px 470px;animation:escoba 1.4s ease-in-out infinite alternate;transition:transform .6s}
@keyframes escoba{from{transform:translateX(-6px) rotate(-2.5deg)}to{transform:translateX(5px) rotate(2.5deg)}}
#st .a-escoba.quieta{animation:none;transform:none}
#st .a-gota{animation:gota 3s ease-in infinite}
@keyframes gota{0%{transform:translateY(0);opacity:0}15%{opacity:1}80%{transform:translateY(104px);opacity:1}100%{transform:translateY(106px);opacity:0}}
#st .fr{transition:transform .45s ease-in-out}
.polvo{position:absolute;width:8px;height:8px;margin:-4px;border-radius:50%;background:#e8e6dc;pointer-events:none;z-index:6}
.niebla{position:absolute;inset:0;pointer-events:none;overflow:hidden;display:none}
.niebla.on{display:block}
.niebla div{position:absolute;top:0;left:0;width:200%;height:100%;opacity:.16;background-size:50% 100%;animation:niebla 70s linear infinite}
@keyframes niebla{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* dentro de la lupa, todo quieto: se redibuja con cada movimiento del dedo */
#lens *{animation:none!important;transition:none!important}
/* ===== Tanda 2 (se quita poniendo ANIM2=false) ===== */
.anim2 #st .resp{transform-box:fill-box;transform-origin:50% 100%;animation:resp 3.4s ease-in-out infinite alternate}
@keyframes resp{from{transform:scaleY(1)}to{transform:scaleY(1.012)}}
.anim2 #st .resp.habla{animation:habla .45s ease-in-out infinite alternate}
@keyframes habla{from{transform:rotate(-.8deg) translateY(0)}to{transform:rotate(.8deg) translateY(-1.5px)}}
.anim2 #st .a-vaso{animation:vaso 1.1s ease-in-out infinite alternate}
@keyframes vaso{from{transform:translate(0,0)}to{transform:translate(-3px,-2px)}}
.anim2 #st .a-brasa{animation:brasa 4s ease-in-out infinite}
@keyframes brasa{0%,70%,100%{fill:#ff8a3a}80%{fill:#ffe08a}}
.anim2 #st .diarioG{transform-box:view-box;transform-origin:400px 250px;animation:diario .7s cubic-bezier(.3,1.3,.5,1) both}
@keyframes diario{from{transform:translateY(-60px) scale(1.06);opacity:0}to{transform:none;opacity:1}}
.anim2 #doc.on .paper{animation:despliega .5s ease-out both}
@keyframes despliega{from{transform:rotate(-2deg) scaleY(.05);opacity:.3}to{transform:rotate(-2deg) scaleY(1);opacity:1}}
.anim2 .badge.salta{animation:salta .5s ease-out}
@keyframes salta{0%{transform:scale(1)}40%{transform:scale(1.5)}70%{transform:scale(.9)}100%{transform:scale(1)}}
.anim2 .dog.lie svg>g{transform-box:fill-box;transform-origin:50% 100%;animation:duerme 2.4s ease-in-out infinite alternate}
@keyframes duerme{from{transform:scaleY(1)}to{transform:scaleY(1.05)}}
</style>
</head>
<body>
<div id="app" class="anim2">

<script>
'use strict';
const $=s=>document.querySelector(s),app=$('#app');
const SVG={{SCENES}};
// Salón con la bandeja de Benigna en el suelo y su cara de sorpresa (😮). salonCa = con animación de la caída.
{const T='<path d="M-16 -104h56" stroke="#8a8a8a" stroke-width="4"/><ellipse cx="22" cy="-106" rx="26" ry="4" fill="#b8b8b8"/><path d="M8 -110v-8h6v8M28 -110v-10h5v10" fill="#e8e2d4"/>',
 F='<circle cx="-5" cy="-171" r="1.6" fill="#2a2018"/><circle cx="5" cy="-171" r="1.6" fill="#2a2018"/><path d="M-5 -161q5-2 10 0" stroke="#7a4f3f" stroke-width="1.3" fill="none"/>',
 CARA='<circle cx="-5" cy="-171" r="3" fill="#f4efe6"/><circle cx="5" cy="-171" r="3" fill="#f4efe6"/><circle cx="-5" cy="-171" r="1.5" fill="#2a2018"/><circle cx="5" cy="-171" r="1.5" fill="#2a2018"/><path d="M-9 -176.5q4-3.5 8-1M1 -177.5q4-2.5 8 1" stroke="#5e5a55" stroke-width="1.3" fill="none"/><ellipse cx="0" cy="-160.5" rx="2.6" ry="3.6" fill="#4a2620"/>',
 MANCHA='<ellipse cx="44" cy="0" rx="24" ry="5" fill="#6e1f2e" opacity=".6"/>',
 BANDEJA='<ellipse cx="36" cy="-3" rx="26" ry="4" fill="#b8b8b8" transform="rotate(-5 36 -3)"/><ellipse cx="36" cy="-4" rx="22" ry="2.6" fill="#d4d4d4" transform="rotate(-5 36 -4)"/><rect x="50" y="-10" width="11" height="5" rx="1.5" fill="#e8e2d4" transform="rotate(-18 55 -7)"/><rect x="12" y="-8" width="10" height="5" rx="1.5" fill="#e8e2d4" transform="rotate(14 17 -5)"/><path d="M66 -3l4-3l1 4zM6 -2l-3-4l5 1zM60 1l5-1l-2 3z" fill="#f2efe8"/>',
 FIN='</g></g>';
 const base=SVG.salon.replace(T,'').replace(F,CARA);
 const i=base.indexOf(FIN,base.indexOf(CARA));
 SVG.salonC=base.slice(0,i)+MANCHA+BANDEJA+base.slice(i);
 SVG.salonCa=base.slice(0,i)+'<style>.bjCae{animation:bjCae .7s cubic-bezier(.5,0,.75,0) both}.bjCae>g{animation:bjRebota .35s .7s ease-out both}.bjMan{animation:bjMan .6s .75s ease-out both}@keyframes bjCae{0%{transform:translate(-14px,-103px)}100%{transform:none}}@keyframes bjRebota{0%{transform:none}40%{transform:translateY(-6px)}100%{transform:none}}@keyframes bjMan{from{opacity:0}to{opacity:1}}</style><g class="bjMan">'+MANCHA+'</g><g class="bjCae"><g>'+BANDEJA+'</g></g>'+base.slice(i);}
const ALL=location.hash==='#todo';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// ================= música y sonidos (todo generado, sin archivos) =================
// Cada ubicación tiene su música; en las pantallas de puzle la música sigue de fondo, más baja, y suenan los efectos.
const AU=(()=>{
  let ctx=null,master,musB,sfxB,NB=null,cur=null,curName=null,want=null,ducked=false,on=true,lastG=0;
  try{on=localStorage.getItem('altamar-sonido')!=='0'}catch(e){}
  const hz=n=>440*Math.pow(2,(n-69)/12),R=(a,b)=>a+Math.random()*(b-a);
  function init(){
    if(ctx){if(ctx.state!=='running')ctx.resume().catch(()=>{});return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
    ctx=new AC();master=ctx.createGain();master.gain.value=on?1:0;const lim=ctx.createDynamicsCompressor();lim.threshold.value=-14;lim.ratio.value=6;lim.attack.value=.005;lim.release.value=.2;master.connect(lim);lim.connect(ctx.destination);
    musB=ctx.createGain();musB.gain.value=1;musB.connect(master);sfxB=ctx.createGain();sfxB.gain.value=1.5;sfxB.connect(master);
    NB=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    if(want)start(want)}
  ['pointerdown','touchend','keydown'].forEach(ev=>document.addEventListener(ev,init,{passive:true}));
  // ---------- piezas básicas ----------
  function env(g,t,a,peak,hold,rel){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.setValueAtTime(peak,t+a+hold);g.gain.linearRampToValueAtTime(0,t+a+hold+rel)}
  function osc(type,f,t,dur,out,det){const o=ctx.createOscillator();o.type=type;o.frequency.value=f;if(det)o.detune.value=det;o.connect(out);o.start(t);o.stop(t+dur+.05);return o}
  function noise(t,dur,out){const s=ctx.createBufferSource();s.buffer=NB;s.loop=true;s.connect(out);s.start(t,R(0,1.5));s.stop(t+dur+.05);return s}
  function filt(type,f,q,out){const b=ctx.createBiquadFilter();b.type=type;b.frequency.value=f;if(q)b.Q.value=q;b.connect(out);return b}
  function gain(v,out){const g=ctx.createGain();g.gain.value=v;g.connect(out);return g}
  // acordeón: tres lengüetas (una desafinada, el «musette») y un filtro suave
  function acc(out,t,n,dur,v=1,soft){const g=ctx.createGain(),f=filt('lowpass',soft?1100:1900,.7,out);g.connect(f);
    env(g,t,soft?.09:.03,.05*v,Math.max(.01,dur-.12),soft?.25:.09);const fr=hz(n);
    osc('sawtooth',fr,t,dur+.3,g);osc('sawtooth',fr,t,dur+.3,g,soft?5:9);osc('square',fr/2,t,dur+.3,gain(.35,g))}
  function accBajo(out,t,n,dur,v=1){const g=ctx.createGain(),f=filt('lowpass',520,.7,out);g.connect(f);env(g,t,.02,.07*v,Math.max(.01,dur-.08),.08);
    osc('sawtooth',hz(n),t,dur+.2,g);osc('triangle',hz(n),t,dur+.2,g)}
  function organo(out,t,n,dur,v=1){const g=ctx.createGain(),f=filt('lowpass',1400,.5,out);g.connect(f);env(g,t,.6,.022*v,Math.max(.01,dur-.6),1.2);
    [[1,1],[2,.5],[3,.22],[4,.14]].forEach(([m,a])=>osc('sine',hz(n)*m,t,dur+1.3,gain(a,g)))}
  function cajita(out,t,n,v=1){const g=ctx.createGain();g.connect(out);g.gain.setValueAtTime(.09*v,t);g.gain.exponentialRampToValueAtTime(.0005,t+1.6);
    osc('sine',hz(n),t,1.7,g);osc('sine',hz(n)*4.02,t,.4,gain(.18,g))}
  function piano(out,t,n,v=1){const g=ctx.createGain(),f=filt('lowpass',2400,.5,out);g.connect(f);g.gain.setValueAtTime(.07*v,t);g.gain.exponentialRampToValueAtTime(.0005,t+2.2);
    osc('triangle',hz(n),t,2.3,g);osc('sine',hz(n)*2,t,.8,gain(.25,g))}
  function chas(out,t,v=1){const g=ctx.createGain(),f=filt('highpass',6500,.5,out);g.connect(f);g.gain.setValueAtTime(.05*v,t);g.gain.exponentialRampToValueAtTime(.0005,t+.12);noise(t,.15,g)}
  function golpeMadera(out,t,v=1,f=180){const g=ctx.createGain();g.connect(out);g.gain.setValueAtTime(.25*v,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);
    const o=osc('sine',f*1.6,t,.15,g);o.frequency.exponentialRampToValueAtTime(f,t+.06);
    const n=ctx.createGain(),b=filt('bandpass',900,1.5,out);n.connect(b);n.gain.setValueAtTime(.18*v,t);n.gain.exponentialRampToValueAtTime(.001,t+.05);noise(t,.06,n)}
  // fondos continuos: olas, viento, murmullo, zumbido
  function olas(out,v=1){const s=ctx.createBufferSource();s.buffer=NB;s.loop=true;const f=filt('lowpass',480,.4,out),g=ctx.createGain();g.gain.value=.05*v;s.connect(g);g.connect(f);
    const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=1/7.5;lg.gain.value=.04*v;l.connect(lg);lg.connect(g.gain);s.start();l.start();return()=>{s.stop();l.stop()}}
  function viento(out,v=1){const s=ctx.createBufferSource();s.buffer=NB;s.loop=true;const f=filt('bandpass',520,3,out),g=ctx.createGain();g.gain.value=.05*v;s.connect(g);g.connect(f);
    const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=1/11;lg.gain.value=260;l.connect(lg);lg.connect(f.frequency);s.start();l.start();return()=>{s.stop();l.stop()}}
  function murmullo(out,v=1){const s=ctx.createBufferSource();s.buffer=NB;s.loop=true;const f=filt('bandpass',420,1.2,out),g=ctx.createGain();g.gain.value=.03*v;s.connect(g);g.connect(f);
    const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=.7;lg.gain.value=.012*v;l.connect(lg);lg.connect(g.gain);s.start();l.start();return()=>{s.stop();l.stop()}}
  function zumbido(out,n,v=1){const g=gain(.012*v,filt('lowpass',260,.5,out));const a=osc('sawtooth',hz(n),ctx.currentTime,36000,g),b=osc('sine',hz(n),ctx.currentTime,36000,g,7);return()=>{a.stop();b.stop()}}
  function gaviota(out,t){for(let k=0;k<2;k++){const tt=t+k*.32,g=ctx.createGain(),f=filt('bandpass',1500,2,out);g.connect(f);env(g,tt,.02,.03,.12,.1);
    const o=osc('sawtooth',R(1500,1700),tt,.3,g);o.frequency.exponentialRampToValueAtTime(R(900,1050),tt+.25)}}
  function campana(out,t,n=84,v=1){[[1,.06],[2.4,.025],[3.9,.012]].forEach(([m,a])=>{const g=ctx.createGain();g.connect(out);g.gain.setValueAtTime(a*v,t);g.gain.exponentialRampToValueAtTime(.0003,t+3);osc('sine',hz(n)*m,t,3.1,g)})}
  function tictac(out,t,alto){const g=ctx.createGain(),f=filt('bandpass',alto?3200:2400,6,out);g.connect(f);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.03);noise(t,.04,g)}
  // ---------- secuenciador: cada tema es una lista de notas por compás que se repite ----------
  function seq(out,bpm,len,fn){let beat=0,t0=ctx.currentTime+.15;const spb=60/bpm;
    const id=setInterval(()=>{while(t0+beat*spb<ctx.currentTime+.6){fn(t0+beat*spb,beat%len,spb,Math.floor(beat/len));beat+=.5}},120);return()=>clearInterval(id)}
  const play=(f,mel,b,t,spb,...a)=>{let p=0;for(const[n,d]of mel){if(p===b&&n!=null)f(t,n,d*spb,...a);p+=d}};
  // melodías
  const VALS=[[71,1],[74,1],[79,1],[78,2],[76,1],[74,1],[72,1],[71,1],[69,3],[69,1],[72,1],[78,1],[76,2],[74,1],[72,1],[71,1],[69,1],[67,3]];
  const VALS_AC=[[43,[55,59,62]],[38,[54,57,62]],[43,[55,59,62]],[38,[54,57,62]],[38,[54,57,60]],[36,[55,60,64]],[38,[54,57,60]],[43,[55,59,62]]];
  const TRIKI=[[74,.5],[78,.5],[81,.5],[78,.5],[79,.5],[76,.5],[73,.5],[76,.5],[78,.5],[74,.5],[69,.5],[74,.5],[76,.5],[76,.5],[76,.5],[null,.5],
               [74,.5],[78,.5],[81,.5],[83,.5],[81,.5],[79,.5],[78,.5],[76,.5],[74,.5],[76,.5],[78,.5],[73,.5],[74,.5],[null,.5],[74,.5],[null,.5]];
  const TRIKI_AC=[[38,[57,62,66]],[45,[57,61,64]],[38,[57,62,66]],[45,[57,61,64]],[38,[57,62,66]],[45,[55,61,64]],[45,[57,61,64]],[38,[57,62,66]]];
  const NANA=[[72,1],[77,1],[81,1],[79,2],[77,1],[76,1],[77,1],[79,1],[72,3],[74,1],[76,1],[77,1],[79,2],[76,1],[74,2],[72,1],[77,3]];
  const MUELLE=[[64,1],[69,1],[71,1],[72,2],[71,1],[69,2],[67,1],[64,3],[65,1],[67,1],[69,1],[71,2],[69,1],[68,2],[71,1],[69,3]];
  const FARO=[[64,2],[67,2],[71,2],[69,4],[67,2],[66,2],[64,4],[null,2],[62,2],[64,2],[67,2],[66,4],[62,2],[64,6],[null,2]];
  // ---------- los temas ----------
  const T={
    // periódico: piano tranquilo de mañana
    periodico(o){const ch=[[48,55,64,67],[45,52,60,64],[41,53,57,65],[43,55,59,62]];
      return seq(o,66,16,(t,b,spb)=>{if(b%1)return;const c=ch[Math.floor(b/4)],k=b%4;piano(o,t,c[k],k?.6:.9);if(!k)piano(o,t,c[0]-12,.5)})},
    // estación del Topo: gente, campana del andén y un acordeonista lejano
    estacion(o){const st=[murmullo(o,1.2)],m=gain(.6,o);
      const s=seq(o,64,16,(t,b,spb,r)=>{play((t,n,d)=>acc(m,t,n,d,.55,1),TRIKI,b,t,spb);if(b===0&&r%3===1){campana(o,t+.2,86,.8);campana(o,t+.7,86,.6)}});
      return()=>{s();st.forEach(f=>f())}},
    // casa de Aitor y Eki: vals lento de acordeón, cálido
    casa(o){return seq(o,84,24,(t,b,spb)=>{play((t,n,d)=>acc(o,t,n,d,.8,1),VALS,b,t,spb);
      if(b%1===0){const[r,c]=VALS_AC[Math.floor(b/3)];if(b%3===0)accBajo(o,t,r,spb*.9,.9);else c.forEach(n=>accBajo(o,t,n,spb*.45,.28))}})},
    // el portal de noche: viento y un bordón grave
    portal(o){const st=[viento(o,.8),zumbido(o,38,.8)];return()=>st.forEach(f=>f())},
    // el faro: mar, viento y un acordeón muy suave y lento
    faro(o){const st=[olas(o,1.1),viento(o,.7)],m=gain(.75,o);
      const s=seq(o,62,40,(t,b,spb)=>{play((t,n,d)=>acc(m,t,n,d,.6,1),FARO,b,t,spb);if(b===0||b===20)accBajo(m,t,40,spb*18,.35)});return()=>{s();st.forEach(f=>f())}},
    // esa noche: nana de cajita de música y el mar a lo lejos
    noche(o){const st=[olas(o,.45)];const s=seq(o,58,24,(t,b,spb)=>play((t,n)=>cajita(o,t,n,.8),NANA,b,t,spb));return()=>{s();st.forEach(f=>f())}},
    // el muelle: olas, gaviotas y acordeón lento
    muelle(o){const st=[olas(o,1)],m=gain(.75,o);
      const s=seq(o,70,24,(t,b,spb,r)=>{play((t,n,d)=>acc(m,t,n,d,.65,1),MUELLE,b,t,spb);if(b===0||b===12)accBajo(m,t,b?40:45,spb*11,.35);if(b===6&&r%2===0)gaviota(o,t)});
      return()=>{s();st.forEach(f=>f())}},

  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up)});
layout();drawCal();show('cal');
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
