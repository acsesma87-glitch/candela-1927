<radialGradient id="warm"><stop offset="0" stop-color="#ffcf80" stop-opacity=".95"/><stop offset=".35" stop-color="#ffb757" stop-opacity=".35"/><stop offset="1" stop-color="#ff9a30" stop-opacity="0"/></radialGradient>
<radialGradient id="pale"><stop offset="0" stop-color="#fff2c8" stop-opacity=".9"/><stop offset="1" stop-color="#fff2c8" stop-opacity="0"/></radialGradient>
<radialGradient id="green"><stop offset="0" stop-color="#7dffb0" stop-opacity=".9"/><stop offset="1" stop-color="#3cff8a" stop-opacity="0"/></radialGradient>
