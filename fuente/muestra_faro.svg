<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04080b"/><stop offset=".6" stop-color="#16212a"/><stop offset="1" stop-color="#3a3d3f"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3439"/><stop offset=".35" stop-color="#121c21"/><stop offset="1" stop-color="#03080a"/></linearGradient>
