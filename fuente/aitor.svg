<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05090c"/><stop offset="1" stop-color="#1c252b"/></linearGradient>
<radialGradient id="warm"><stop offset="0" stop-color="#ffcf80" stop-opacity=".85"/><stop offset=".4" stop-color="#ffb757" stop-opacity=".28"/><stop offset="1" stop-color="#ff9a30" stop-opacity="0"/></radialGradient>
<radialGradient id="vig" cx=".5" cy=".5" r=".72"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".9"/></radialGradient>
<linearGradient id="coat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3f48"/><stop offset=".5" stop-color="#2a2e35"/><stop offset="1" stop-color="#15171b"/></linearGradient>
<linearGradient id="skin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e3bea2"/><stop offset=".6" stop-color="#cfa588"/><stop offset="1" stop-color="#9c7660"/></linearGradient>
<linearGradient id="hair" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a3a2e"/><stop offset=".5" stop-color="#33281f"/><stop offset="1" stop-color="#1e1712"/></linearGradient>
<filter id="fog"><feTurbulence type="fractalNoise" baseFrequency=".01 .03" numOctaves="4" seed="3"/><feColorMatrix values="0 0 0 0 .8 0 0 0 0 .82 0 0 0 0 .84 0 0 0 1.1 -.45"/></filter>
<filter id="b4"><feGaussianBlur stdDeviation="4"/></filter>
<pattern id="cob" width="36" height="16" patternUnits="userSpaceOnUse"><rect width="36" height="16" fill="#1e1b18"/><path d="M0 15.5H36M18 0V8M0 7.5H36M9 8V16M27 8V16" stroke="#0c0a09" stroke-width="1.5"/></pattern>
